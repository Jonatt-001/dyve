<head>
  <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Dyve Studio — Coder Environment</title>
  <meta name="description" content="Dyve Studio Coder: A premium, real-time HTML, CSS, and JavaScript development environment by Dyve.">
  <meta name="theme-color" content="#0a0e1a">
  <link rel="icon" href="/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
 <style>
    :root {
      --bg-primary: #0a0e1a;
      --bg-secondary: #111827;
      --bg-tertiary: #1f2937;
      --bg-editor: #0d1117;
      --border-color: #1f2937;
      --border-light: #374151;
      --text-primary: #f9fafb;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      --accent-primary: #f15e50;
      --accent-hover: #d94a3e;
      --accent-glow: rgba(241, 94, 80, 0.15);
      --success: #10b981;
      --warning: #f59e0b;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
      border-bottom: 1px solid var(--border-color);
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-md);
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--accent-primary) 0%, #ff8a65 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo-divider {
      color: var(--text-muted);
      font-weight: 400;
    }

    .playground-title {
      color: var(--text-primary);
      font-weight: 600;
      font-size: 16px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: inherit;
    }

    .btn-secondary {
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      border: 1px solid var(--border-light);
    }

    .btn-secondary:hover {
      background: var(--border-light);
      color: var(--text-primary);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-hover) 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(241, 94, 80, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(241, 94, 80, 0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-icon {
      width: 36px;
      height: 36px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
    }

    /* Main Container */
    .container {
      flex: 1;
      display: flex;
      overflow: hidden;
      background: var(--bg-primary);
    }

    /* Editor Panel */
    .editor-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border-color);
      min-width: 0;
    }

    .tabs {
      display: flex;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      padding: 0 12px;
      gap: 4px;
    }

    .tab {
      padding: 12px 20px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      font-family: inherit;
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab:hover {
      color: var(--text-secondary);
    }

    .tab.active {
      color: var(--accent-primary);
      border-bottom-color: var(--accent-primary);
      background: rgba(241, 94, 80, 0.05);
    }

    .tab-indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .tab.active .tab-indicator {
      background: var(--accent-primary);
      box-shadow: 0 0 8px var(--accent-primary);
    }

    .tab.html .tab-indicator { background: #e34c26; }
    .tab.css .tab-indicator { background: #264de4; }
    .tab.js .tab-indicator { background: #f0db4f; }

    .editors {
      flex: 1;
      position: relative;
      background: var(--bg-editor);
    }

    .editor {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: none;
    }

    .editor.active {
      display: block;
    }

    .editor-wrapper {
      position: relative;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .editor-header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
    }

    .editor-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .line-numbers {
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
    }

    textarea {
      flex: 1;
      width: 100%;
      background: var(--bg-editor);
      color: var(--text-primary);
      border: none;
      padding: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      line-height: 1.6;
      resize: none;
      outline: none;
      tab-size: 2;
      caret-color: var(--accent-primary);
    }

    textarea::placeholder {
      color: var(--text-muted);
      opacity: 0.6;
    }

    textarea::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    textarea::-webkit-scrollbar-track {
      background: var(--bg-secondary);
    }

    textarea::-webkit-scrollbar-thumb {
      background: var(--border-light);
      border-radius: 5px;
    }

    textarea::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    /* Preview Panel */
    .preview-panel {
      flex: 1;
      background: var(--bg-secondary);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .preview-header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .preview-label {
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .preview-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--success);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .preview-frame {
      flex: 1;
      border: none;
      background: white;
    }

    /* Resizer */
    .resizer {
      width: 4px;
      background: var(--border-color);
      cursor: col-resize;
      transition: background 0.2s;
    }

    .resizer:hover {
      background: var(--accent-primary);
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--bg-secondary);
      color: var(--text-primary);
      padding: 14px 24px;
      border-radius: 12px;
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-xl);
      display: none;
      align-items: center;
      gap: 12px;
      animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1000;
      font-weight: 500;
    }

    .toast.show {
      display: flex;
    }

    .toast-icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes slideIn {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .header {
        padding: 0 16px;
        height: 56px;
      }

      .playground-title {
        display: none;
      }

      .btn span {
        display: none;
      }

      .container {
        flex-direction: column;
      }

      .editor-panel {
        border-right: none;
        border-bottom: 1px solid var(--border-color);
        height: 50%;
      }

      .preview-panel {
        height: 50%;
      }

      .resizer {
        display: none;
      }

      .tab {
        padding: 10px 16px;
        font-size: 12px;
      }
    }

    /* Loading State */
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--text-muted);
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border-color);
      border-top-color: var(--accent-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Empty State */
    .empty-state {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: var(--text-muted);
      pointer-events: none;
    }

    .empty-state-icon {
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
      opacity: 0.3;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="brand">
      <div class="logo">DYVE</div>
      <span class="logo-divider">|</span>
      <span class="playground-title">PLAYGROUND</span>
    </div>
    <div class="header-actions">
      <button class="btn btn-secondary btn-icon" onclick="resetCode()" title="Reset Code">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
      </button>
      <button class="btn btn-secondary" onclick="toggleConsole()" title="Toggle Console">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="4 17 10 11 4 5"></polyline>
          <line x1="12" y1="19" x2="20" y2="19"></line>
        </svg>
        <span>Console</span>
      </button>
      <button class="btn btn-primary" onclick="saveAndShare()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
        <span>Save & Get Link</span>
      </button>
    </div>
  </header>

  <div class="container">
    <div class="editor-panel">
      <div class="tabs">
        <button class="tab html active" onclick="switchTab('html')">
          <span class="tab-indicator"></span>
          HTML
        </button>
        <button class="tab css" onclick="switchTab('css')">
          <span class="tab-indicator"></span>
          CSS
        </button>
        <button class="tab js" onclick="switchTab('js')">
          <span class="tab-indicator"></span>
          JavaScript
        </button>
      </div>
      <div class="editors">
        <div class="editor active" id="htmlEditor">
          <div class="editor-wrapper">
            <div class="editor-header">
              <div class="editor-info">
                <span class="line-numbers">index.html</span>
              </div>
              <span id="htmlLines">0 lines</span>
            </div>
            <textarea id="htmlCode" placeholder="<!-- Enter HTML code here -->" spellcheck="false"></textarea>
          </div>
        </div>
        <div class="editor" id="cssEditor">
          <div class="editor-wrapper">
            <div class="editor-header">
              <div class="editor-info">
                <span class="line-numbers">styles.css</span>
              </div>
              <span id="cssLines">0 lines</span>
            </div>
            <textarea id="cssCode" placeholder="/* Enter CSS code here */" spellcheck="false"></textarea>
          </div>
        </div>
        <div class="editor" id="jsEditor">
          <div class="editor-wrapper">
            <div class="editor-header">
              <div class="editor-info">
                <span class="line-numbers">script.js</span>
              </div>
              <span id="jsLines">0 lines</span>
            </div>
            <textarea id="jsCode" placeholder="// Enter JavaScript code here" spellcheck="false"></textarea>
          </div>
        </div>
      </div>
    </div>
    
    <div class="resizer"></div>
    
    <div class="preview-panel">
      <div class="preview-header">
        <div class="preview-label">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="1 1 23 1 12 12 1 1"></polygon>
            <path d="M1 12l11 11 11-11"></path>
          </svg>
          Live Preview
        </div>
        <div class="preview-status">
          <span class="status-dot"></span>
          <span>Auto-updating</span>
        </div>
      </div>
      <iframe id="preview" class="preview-frame" sandbox="allow-scripts allow-same-origin"></iframe>
    </div>
  </div>

  <div id="toast" class="toast">
    <div class="toast-icon">✓</div>
    <span id="toastMessage">Link copied to clipboard!</span>
  </div>

  <script>
    let activeTab = 'html';
    let updateTimeout;

    function loadFromURL() {
      const params = new URLSearchParams(window.location.search);
      const html = params.get('html');
      const css = params.get('css');
      const js = params.get('js');
      
      if (html) document.getElementById('htmlCode').value = decodeURIComponent(html);
      if (css) document.getElementById('cssCode').value = decodeURIComponent(css);
      if (js) document.getElementById('jsCode').value = decodeURIComponent(js);
      
      updateLineCounts();
      updatePreview();
    }
    
    function switchTab(tab) {
      activeTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.closest('.tab').classList.add('active');
      
      document.querySelectorAll('.editor').forEach(e => e.classList.remove('active'));
      document.getElementById(tab + 'Editor').classList.add('active');
    }
    
    function updatePreview() {
      clearTimeout(updateTimeout);
      updateTimeout = setTimeout(() => {
        const html = document.getElementById('htmlCode').value;
        const css = document.getElementById('cssCode').value;
        const js = document.getElementById('jsCode').value;
        
        const preview = document.getElementById('preview');
        const content = `<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
      background: #ffffff;
      color: #1f2937;
      line-height: 1.6;
    }
    ${css}
  </style>
</head>
<body>
  ${html}
  <script>
    try {
      ${js}
    } catch (e) {
      console.error('Runtime Error:', e);
    }
  <\/script>
</body>
</html>`;
        
        const blob = new Blob([content], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        preview.src = url;
        
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }, 300);
    }
    
    function updateLineCounts() {
      ['html', 'css', 'js'].forEach(type => {
        const textarea = document.getElementById(type + 'Code');
        const lines = textarea.value.split('\n').length;
        document.getElementById(type + 'Lines').textContent = `${lines} line${lines !== 1 ? 's' : ''}`;
      });
    }
    
    ['htmlCode', 'cssCode', 'jsCode'].forEach(id => {
      const textarea = document.getElementById(id);
      
      textarea.addEventListener('input', () => {
        updateLineCounts();
        updatePreview();
      });
      
      textarea.addEventListener('keydown', (e) => {
        if (e.key === 'Tab') {
          e.preventDefault();
          const start = textarea.selectionStart;
          const end = textarea.selectionEnd;
          textarea.value = textarea.value.substring(0, start) + '  ' + textarea.value.substring(end);
          textarea.selectionStart = textarea.selectionEnd = start + 2;
        }
      });
    });
    
    function resetCode() {
      if (confirm('Are you sure you want to clear all code?')) {
        document.getElementById('htmlCode').value = '';
        document.getElementById('cssCode').value = '';
        document.getElementById('jsCode').value = '';
        updateLineCounts();
        updatePreview();
        showToast('🗑️ Code cleared');
      }
    }
    
    function toggleConsole() {
      showToast(' Console panel coming soon!');
    }
    
    function saveAndShare() {
      const html = encodeURIComponent(document.getElementById('htmlCode').value);
      const css = encodeURIComponent(document.getElementById('cssCode').value);
      const js = encodeURIComponent(document.getElementById('jsCode').value);
      
      const url = `${window.location.origin}${window.location.pathname}?html=${html}&css=${css}&js=${js}`;
      
      navigator.clipboard.writeText(url).then(() => {
        showToast('✅ Link copied to clipboard!');
      }).catch(() => {
        prompt('Copy this link:', url);
      });
    }
    
    function showToast(message) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMessage').textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // Resizer functionality
    const resizer = document.querySelector('.resizer');
    const editorPanel = document.querySelector('.editor-panel');
    let isResizing = false;

    resizer.addEventListener('mousedown', (e) => {
      isResizing = true;
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
    });

    document.addEventListener('mousemove', (e) => {
      if (!isResizing) return;
      
      const containerWidth = document.querySelector('.container').offsetWidth;
      const newWidth = ((e.clientX / containerWidth) * 100);
      
      if (newWidth > 20 && newWidth < 80) {
        editorPanel.style.flex = `0 0 ${newWidth}%`;
      }
    });

    document.addEventListener('mouseup', () => {
      isResizing = false;
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    });

    // Initialize
    loadFromURL();
    updateLineCounts();
  </script>
</body>
</html>
