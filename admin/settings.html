<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Settings - Dyve HackaX Dashboard</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020403">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dyve: {
                            bg: '#020403',
                            accent: '#00ffaa',
                            accentHover: '#00cc88',
                            muted: 'rgba(255,255,255,0.6)'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    
    <!-- HEADER -->
    <header class="bg-dyve-bg border-b border-white/10 sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="index.html" class="text-dyve-muted hover:text-dyve-accent transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                </a>
                <h1 class="text-xl font-bold text-white tracking-wide">DYVE<span class="text-dyve-accent">|</span>SETTINGS</h1>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="space-y-6">
            
            <!-- GitHub Configuration -->
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                <h2 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2">
                    <svg class="w-5 h-5 text-dyve-accent" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                    GitHub Configuration
                </h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">GitHub Personal Access Token</label>
                        <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxx" 
                               class="w-full px-4 py-3 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-dyve-accent focus:border-transparent font-mono">
                        <p class="mt-1 text-xs text-gray-500">Required for publishing articles and updating feeds.</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Repository</label>
                        <input type="text" id="githubRepo" placeholder="username/repository" 
                               class="w-full px-4 py-3 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-dyve-accent focus:border-transparent">
                        <p class="mt-1 text-xs text-gray-500">Format: username/repository-name</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Branch</label>
                        <input type="text" id="githubBranch" placeholder="main" value="main"
                               class="w-full px-4 py-3 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-dyve-accent focus:border-transparent">
                    </div>
                </div>
            </div>

            <!-- Site Configuration -->
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                <h2 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2">
                    <svg class="w-5 h-5 text-dyve-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
                    Site Configuration
                </h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Site URL</label>
                        <input type="url" id="siteUrl" placeholder="https://dyve.online" value="https://dyve.online"
                               class="w-full px-4 py-3 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-dyve-accent focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Default Author / Unit</label>
                        <input type="text" id="defaultAuthor" placeholder="Dyve HackaX Intelligence Unit" value="Dyve HackaX Intelligence Unit"
                               class="w-full px-4 py-3 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-dyve-accent focus:border-transparent">
                    </div>
                </div>
            </div>

            <!-- Categories -->
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                <h2 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2">
                    <svg class="w-5 h-5 text-dyve-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path></svg>
                    Intel Categories
                </h2>
                <div id="categoriesList" class="space-y-2 mb-4"></div>
                <div class="flex gap-2">
                    <input type="text" id="newCategory" placeholder="Add new category (e.g., malware)..." 
                           class="flex-1 px-4 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-dyve-accent focus:border-transparent lowercase">
                    <button id="addCategoryBtn" class="px-4 py-2 text-sm font-bold text-dyve-bg bg-dyve-accent rounded-lg hover:bg-dyve-accentHover transition">Add</button>
                </div>
            </div>

            <!-- Save Button -->
            <button id="saveSettingsBtn" class="w-full py-3 text-sm font-bold text-dyve-bg bg-dyve-accent rounded-lg hover:bg-dyve-accentHover transition shadow-[0_0_15px_rgba(0,255,170,0.3)]">
                Save Configuration
            </button>

        </div>
    </main>

    <!-- STICKY BOTTOM MENU -->
    <div id="stickyMenu" class="fixed bottom-6 right-6 z-50">
        <button id="menuToggle" class="w-14 h-14 bg-dyve-accent text-dyve-bg rounded-full shadow-lg flex items-center justify-center hover:bg-dyve-accentHover transition-all duration-300 active:scale-95">
            <svg id="menuIcon" class="w-6 h-6 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>

        <div id="slideMenu" class="absolute bottom-20 right-0 bg-white rounded-lg shadow-2xl overflow-hidden transform translate-y-4 opacity-0 pointer-events-none transition-all duration-300 w-56 border border-gray-200">
            <nav class="py-2">
                <a href="settings.html" class="flex items-center gap-3 px-4 py-3 bg-gray-50">
                    <svg class="w-5 h-5 text-dyve-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    <span class="text-sm font-medium text-dyve-accent">Settings</span>
                </a>
                <a href="drafts.html" class="flex items-center gap-3 px-4 py-3 hover:bg-gray-50 transition-colors">
                    <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    <span class="text-sm font-medium text-gray-700">Drafts</span>
                </a>
                <a href="published.html" class="flex items-center gap-3 px-4 py-3 hover:bg-gray-50 transition-colors">
                    <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span class="text-sm font-medium text-gray-700">Published</span>
                </a>
            </nav>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="fixed bottom-24 right-4 bg-dyve-bg text-white border border-dyve-accent/30 px-6 py-3 rounded-lg shadow-2xl hidden z-50 flex items-center gap-2">
        <span id="toastMessage"></span>
    </div>

    <script>
        // Load settings from localStorage
        function loadSettings() {
            const settings = JSON.parse(localStorage.getItem('dyve-settings') || '{}');
            document.getElementById('githubToken').value = settings.githubToken || '';
            document.getElementById('githubRepo').value = settings.githubRepo || '';
            document.getElementById('githubBranch').value = settings.githubBranch || 'main';
            document.getElementById('siteUrl').value = settings.siteUrl || 'https://dyve.online';
            document.getElementById('defaultAuthor').value = settings.defaultAuthor || 'Dyve HackaX Intelligence Unit';
            
            // Default cyber-intelligence categories
            const defaultCats = ['breach', 'dark-web', 'analysis', 'signals', 'threat-actors'];
            renderCategories(settings.categories || defaultCats);
        }

        // Save settings
        function saveSettings() {
            const settings = {
                githubToken: document.getElementById('githubToken').value.trim(),
                githubRepo: document.getElementById('githubRepo').value.trim(),
                githubBranch: document.getElementById('githubBranch').value.trim() || 'main',
                siteUrl: document.getElementById('siteUrl').value.trim(),
                defaultAuthor: document.getElementById('defaultAuthor').value.trim(),
                categories: getCategories()
            };

            if (!settings.githubToken || !settings.githubRepo) {
                showToast('❌ GitHub token and repository are required');
                return;
            }

            localStorage.setItem('dyve-settings', JSON.stringify(settings));
            showToast('✅ Configuration saved successfully');
        }

        // Categories management
        let categories = [];

        function getCategories() {
            return categories;
        }

        function renderCategories(cats) {
            categories = cats;
            const container = document.getElementById('categoriesList');
            container.innerHTML = categories.map(cat => `
                <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg border border-gray-200">
                    <span class="text-sm font-medium text-gray-800 capitalize">${cat}</span>
                    <button onclick="removeCategory('${cat}')" class="text-red-500 hover:text-red-700 transition-colors p-1 hover:bg-red-50 rounded">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
            `).join('');
        }

        function addCategory() {
            const input = document.getElementById('newCategory');
            const value = input.value.trim().toLowerCase().replace(/\s+/g, '-');
            
            if (value && !categories.includes(value)) {
                categories.push(value);
                renderCategories(categories);
                input.value = '';
            } else if (categories.includes(value)) {
                showToast('⚠️ Category already exists');
            } else if (!value) {
                showToast('⚠️ Please enter a category name');
            }
        }

        function removeCategory(cat) {
            categories = categories.filter(c => c !== cat);
            renderCategories(categories);
        }

        // Toast notification
        function showToast(message, duration = 3000) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), duration);
        }

        // Sticky menu
        const menuToggle = document.getElementById('menuToggle');
        const slideMenu = document.getElementById('slideMenu');
        const menuIcon = document.getElementById('menuIcon');
        let menuOpen = false;

        menuToggle.addEventListener('click', () => {
            menuOpen = !menuOpen;
            if (menuOpen) {
                slideMenu.classList.remove('translate-y-4', 'opacity-0', 'pointer-events-none');
                slideMenu.classList.add('translate-y-0', 'opacity-100', 'pointer-events-auto');
                menuIcon.style.transform = 'rotate(90deg)';
            } else {
                slideMenu.classList.add('translate-y-4', 'opacity-0', 'pointer-events-none');
                slideMenu.classList.remove('translate-y-0', 'opacity-100', 'pointer-events-auto');
                menuIcon.style.transform = 'rotate(0deg)';
            }
        });

        document.addEventListener('click', (e) => {
            if (!document.getElementById('stickyMenu').contains(e.target) && menuOpen) {
                menuToggle.click();
            }
        });

        // Event listeners
        document.getElementById('saveSettingsBtn').addEventListener('click', saveSettings);
        document.getElementById('addCategoryBtn').addEventListener('click', addCategory);
        document.getElementById('newCategory').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addCategory();
        });

        // Initialize
        loadSettings();
    </script>
</body>
</html>
