<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Dyve | HackaX Published Intel</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#020403">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{dyve:{bg:"#020403",accent:"#00ffaa"}}}}}</script>
<style>
*{box-sizing:border-box}html,body{width:100%;max-width:100%;overflow-x:hidden}
button,a,input{touch-action:manipulation}button{-webkit-tap-highlight-color:transparent}
button:active,a:active{transform:scale(.985)}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px}
.thumb{width:112px;height:88px;object-fit:cover;border-radius:12px;background:#f1f5f9}
@media(max-width:640px){.thumb{width:100%;height:170px}.article-grid{grid-template-columns:1fr!important}}
</style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900">
<header class="bg-dyve-bg text-white border-b border-white/10 sticky top-0 z-40">
<div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
<a href="index.html?new=1"><b>DYVE<span class="text-dyve-accent">|</span>HACKAX</b><p class="text-[9px] text-white/45 uppercase tracking-[.2em]">Published Intelligence</p></a>
<div class="flex gap-2">
<a href="settings.html" class="border border-white/10 px-3 py-2 rounded-lg text-xs font-bold">Settings</a>
<a href="index.html?new=1" class="bg-dyve-accent text-dyve-bg px-3 py-2 rounded-lg text-xs font-black">New Intel</a>
</div>
</div>
</header>

<main class="max-w-6xl mx-auto px-4 py-6 sm:py-8">
<div class="flex flex-col lg:flex-row lg:items-end justify-between gap-4 mb-6">
<div><div class="text-[10px] uppercase tracking-[.18em] font-black text-emerald-700">Publication control</div><h1 class="text-2xl sm:text-3xl font-black mt-1">Published HackaX Intel</h1><p id="count" class="text-sm text-slate-500 mt-1">Loading article index...</p></div>
<div class="flex gap-2">
<button id="refresh" type="button" class="border bg-white rounded-xl px-4 py-2.5 text-xs font-bold">Refresh</button>
<button id="sortBtn" type="button" class="border bg-white rounded-xl px-4 py-2.5 text-xs font-bold">Newest first</button>
</div>
</div>

<div class="grid sm:grid-cols-3 gap-3 mb-6">
<div class="card p-4"><div class="text-[10px] uppercase tracking-widest text-slate-400 font-black">Total</div><div id="statTotal" class="text-2xl font-black mt-1">—</div></div>
<div class="card p-4"><div class="text-[10px] uppercase tracking-widest text-slate-400 font-black">Latest</div><div id="statLatest" class="text-sm font-bold mt-2">—</div></div>
<div class="card p-4"><div class="text-[10px] uppercase tracking-widest text-slate-400 font-black">Categories</div><div id="statCategories" class="text-sm font-bold mt-2">—</div></div>
</div>

<div class="card p-3 mb-5">
<div class="flex flex-col sm:flex-row gap-2">
<input id="search" class="w-full border rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-emerald-200" placeholder="Search title, category, tag or description...">
<select id="categoryFilter" class="border rounded-xl px-4 py-3 text-sm bg-white"><option value="">All categories</option></select>
</div>
</div>

<div id="error" class="hidden mb-4 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm"></div>
<div id="list" class="grid gap-4"></div>
</main>

<script>
const KEY="dyve-hackax-settings",EDIT="dyve-hackax-edit-article",ARTICLE_DB="assets/articles.json";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
const state={articles:[],sortDesc:true};

function cfg(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return{}}}
function unb64(s){return decodeURIComponent(escape(atob(String(s).replace(/\n/g,""))))}
async function load(){
    const c=cfg();
    $("error").classList.add("hidden");
    if(!c.githubRepo||!c.githubToken){
        $("error").textContent="Configure HackaX GitHub settings first.";
        $("error").classList.remove("hidden");
        render([]);
        return;
    }
    const button=$("refresh");button.disabled=true;button.textContent="Loading...";
    try{
        const r=await fetch(`https://api.github.com/repos/${encodeURIComponent(c.githubRepo)}/contents/${ARTICLE_DB}?ref=${encodeURIComponent(c.githubBranch||"main")}`,{
            headers:{Authorization:`Bearer ${c.githubToken}`,Accept:"application/vnd.github+json"}
        });
        if(r.status===404){state.articles=[];render([]);return}
        if(!r.ok)throw new Error(`GitHub ${r.status}`);
        const d=await r.json(),parsed=JSON.parse(unb64(d.content));
        state.articles=Array.isArray(parsed)?parsed:(Array.isArray(parsed.articles)?parsed.articles:[]);
        buildCategories();
        render(state.articles);
    }catch(e){
        $("error").textContent="Could not load published HackaX articles: "+e.message;
        $("error").classList.remove("hidden");
        render([]);
    }finally{
        button.disabled=false;button.textContent="Refresh";
    }
}
function buildCategories(){
    const values=[...new Set(state.articles.map(x=>x.category||"Intel").filter(Boolean))].sort();
    $("categoryFilter").innerHTML='<option value="">All categories</option>'+values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");
}
function filtered(){
    const q=$("search").value.trim().toLowerCase(),cat=$("categoryFilter").value;
    let a=state.articles.filter(x=>{
        const hay=[x.title,x.description,x.desc,x.category,x.tag,x.meta].join(" ").toLowerCase();
        return(!q||hay.includes(q))&&(!cat||x.category===cat);
    });
    a.sort((x,y)=>{
        const dx=new Date(x.updatedAt||x.publishedAt||x.date||0).getTime();
        const dy=new Date(y.updatedAt||y.publishedAt||y.date||0).getTime();
        return state.sortDesc?dy-dx:dx-dy;
    });
    return a;
}
function render(){
    const a=filtered();
    $("count").textContent=`${a.length} matching item${a.length===1?"":"s"} · ${state.articles.length} total`;
    $("statTotal").textContent=state.articles.length;
    const latest=[...state.articles].sort((x,y)=>new Date(y.updatedAt||y.date||0)-new Date(x.updatedAt||x.date||0))[0];
    $("statLatest").textContent=latest?.date||"—";
    $("statCategories").textContent=new Set(state.articles.map(x=>x.category).filter(Boolean)).size;
    $("list").innerHTML=a.length?a.map((x,i)=>{
        const image=x.image||"";
        const url=x.url||"";
        return `<article class="card p-4 sm:p-5">
            <div class="article-grid grid grid-cols-[112px_minmax(0,1fr)] gap-4">
                ${image?`<img src="${esc(image)}" alt="${esc(x.imageAlt||x.title||"HackaX Intel")}" class="thumb" onerror="this.style.display='none'">`:`<div class="thumb flex items-center justify-center text-[10px] text-slate-400 font-bold">NO IMAGE</div>`}
                <div class="min-w-0">
                    <div class="flex flex-wrap gap-2 items-center text-[10px] font-black uppercase text-emerald-700">
                        <span>${esc(x.category||"Intel")}</span><span class="text-slate-300">•</span><span>${esc(x.meta||x.tag||"")}</span>
                    </div>
                    <h2 class="font-black text-lg mt-1 leading-snug">${esc(x.title||"Untitled Intel")}</h2>
                    <p class="text-xs text-slate-500 mt-1">${esc(x.date||"")} ${x.updatedAt?`• Updated ${esc(String(x.updatedAt).slice(0,10))}`:""} ${x.tag?`• ${esc(x.tag)}`:""}</p>
                    <p class="text-sm text-slate-600 mt-3 line-clamp-2">${esc(x.description||x.desc||"No description stored.")}</p>
                    <div class="flex flex-wrap gap-2 mt-4">
                        ${url?`<a class="bg-dyve-bg text-white px-3 py-2 rounded-lg text-xs font-black" href="../${esc(url)}" target="_blank" rel="noopener">View Intel</a>`:""}
                        <button type="button" data-edit="${esc(x.id||i)}" class="border px-3 py-2 rounded-lg text-xs font-bold">Edit</button>
                    </div>
                </div>
            </div>
        </article>`;
    }).join(""):`<div class="card p-10 text-center text-sm text-slate-500">No published HackaX articles match the current filter.</div>`;
    document.querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click",()=>{
        const id=b.dataset.edit;
        const article=state.articles.find(x=>String(x.id)===String(id))||filtered()[Number(id)];
        if(!article)return;
        localStorage.setItem(EDIT,JSON.stringify(article));
        location.href="index.html?mode=edit";
    }));
}
$("refresh").addEventListener("click",load);
$("sortBtn").addEventListener("click",()=>{state.sortDesc=!state.sortDesc;$("sortBtn").textContent=state.sortDesc?"Newest first":"Oldest first";render()});
$("search").addEventListener("input",render);
$("categoryFilter").addEventListener("change",render);
load();
</script>
</body>
</html>
