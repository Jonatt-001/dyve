<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Published - Dyve HackaX Dashboard</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#020403">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dyve Admin">
<link rel="apple-touch-icon" href="logo.png">

    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dyve: {
                            bg: '#020403',
                            card: '#030605',
                            accent: '#00ffaa',
                            accentHover: '#00cc88',
                            text: '#e8f0ee',
                            muted: 'rgba(255,255,255,0.6)'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #f8fafc; }
        .article-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .article-card:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); 
            border-color: #00ffaa; 
        }
        .thumbnail-container { position: relative; overflow: hidden; }
        .thumbnail-container img { transition: transform 0.5s ease; }
        .article-card:hover .thumbnail-container img { transform: scale(1.05); }
        .skeleton { 
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); 
            background-size: 200% 100%; 
            animation: shimmer 1.5s infinite; 
        }
        @keyframes shimmer { 
            0% { background-position: 200% 0; } 
            100% { background-position: -200% 0; } 
        }
        /* Custom checkbox style */
        .article-checkbox:checked {
            background-color: #00ffaa;
            border-color: #00ffaa;
        }
    </style>
</head>
<body class="min-h-screen">
    
    <!-- HEADER -->
    <header class="bg-dyve-bg border-b border-white/10 sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="index.html" class="text-dyve-muted hover:text-dyve-accent transition-colors p-2 hover:bg-white/5 rounded-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                </a>
                <h1 class="text-xl font-bold text-white tracking-wide">DYVE<span class="text-dyve-accent">|</span>PUBLISHED</h1>
            </div>
            <button id="refreshBtn" class="text-dyve-muted hover:text-dyve-accent transition-colors p-2 hover:bg-white/5 rounded-lg flex items-center gap-2" title="Refresh Feed">
                <svg id="refreshIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                <span class="text-sm hidden sm:inline">Refresh</span>
            </button>
        </div>
    </header>

    <!-- BULK ACTION BAR -->
    <div id="bulkActionBar" class="fixed top-24 left-1/2 -translate-x-1/2 bg-dyve-card border border-dyve-accent/50 text-white px-6 py-3 rounded-full shadow-2xl z-50 flex items-center gap-4 transition-all duration-300 transform -translate-y-10 opacity-0 hidden">
        <span id="bulkCount" class="text-sm font-semibold whitespace-nowrap">0 selected</span>
        <div class="w-px h-5 bg-white/20"></div>
        <button onclick="bulkDelete()" class="bg-red-500/10 text-red-400 hover:bg-red-500 hover:text-white border border-red-500/50 px-4 py-1.5 rounded-full text-sm font-bold transition-colors whitespace-nowrap">
            Delete Selected
        </button>
        <button onclick="clearSelection()" class="text-gray-400 hover:text-white text-sm p-1">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
    </div>

    <!-- MAIN CONTENT -->
    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Stats / Filter Bar -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
            <div class="flex items-center gap-2 text-sm text-gray-500">
                <span class="w-2 h-2 bg-dyve-accent rounded-full animate-pulse"></span>
                <span id="articleCount">Loading articles...</span>
            </div>
            <div class="relative w-full sm:w-64">
                <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                <input type="text" id="searchInput" placeholder="Search published intel..." 
                       class="w-full pl-10 pr-4 py-2 bg-white border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-dyve-accent focus:border-transparent text-sm text-gray-900">
            </div>
        </div>

        <!-- Articles List -->
        <div id="publishedList" class="space-y-4">
            <!-- Skeleton Loading -->
            <div class="skeleton h-32 rounded-lg"></div>
            <div class="skeleton h-32 rounded-lg"></div>
            <div class="skeleton h-32 rounded-lg"></div>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16 bg-white rounded-lg border border-gray-200 mt-4">
            <div class="w-20 h-20 mx-auto mb-4 rounded-full bg-gray-100 flex items-center justify-center">
                <svg class="w-10 h-10 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
            </div>
            <h3 class="text-lg font-semibold text-gray-900 mb-2">No published intel yet</h3>
            <p class="text-gray-500 mb-6">Start by creating your first intelligence report</p>
            <a href="index.html" class="inline-flex items-center gap-2 px-6 py-2.5 bg-dyve-accent text-dyve-bg rounded-lg font-bold hover:bg-dyve-accentHover transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                Create Article
            </a>
        </div>
    </main>

    <!-- STICKY BOTTOM MENU -->
    <div id="stickyMenu" class="fixed bottom-6 right-6 z-50">
        <button id="menuToggle" class="w-14 h-14 bg-dyve-accent text-dyve-bg rounded-full shadow-lg flex items-center justify-center hover:bg-dyve-accentHover transition-all duration-300 active:scale-95">
            <svg id="menuIcon" class="w-6 h-6 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>

        <div id="slideMenu" class="absolute bottom-20 right-0 bg-white rounded-lg shadow-2xl overflow-hidden transform translate-y-4 opacity-0 pointer-events-none transition-all duration-300 w-56 border border-gray-200">
            <nav class="py-2">
                <a href="settings.html" class="flex items-center gap-3 px-4 py-3 hover:bg-gray-50 transition-colors">
                    <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    <span class="text-sm font-medium text-gray-700">Settings</span>
                </a>
                <a href="drafts.html" class="flex items-center gap-3 px-4 py-3 hover:bg-gray-50 transition-colors">
                    <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    <span class="text-sm font-medium text-gray-700">Drafts</span>
                </a>
                <a href="published.html" class="flex items-center gap-3 px-4 py-3 bg-gray-50">
                    <svg class="w-5 h-5 text-dyve-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span class="text-sm font-medium text-dyve-accent">Published</span>
                </a>
            </nav>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="fixed bottom-24 right-4 bg-dyve-bg text-white border border-dyve-accent/30 px-6 py-3 rounded-lg shadow-2xl hidden z-50 flex items-center gap-2 transition-all duration-300 transform translate-y-4 opacity-0">
        <span id="toastMessage"></span>
    </div>

<script>
    let allArticles = [];
    let filteredArticles = [];
    let selectedIndices = []; // Holds items selected for bulk actions

    /* ============ ROUTING CONFIG ============ */
    const EDITORS = {
        tech: 'tech-editor/index.html',
        cyber: 'hackax/index.html',
        fallback: 'index.html'
    };
    const EDIT_KEY = 'dyve-edit-article';

    function isTechArticle(a) {
        const cat  = (a.category || '').toLowerCase();
        const page = (a.page || '').toLowerCase();
        const tag  = (a.tag || '').toLowerCase();
        return cat === 'tech' || cat.includes('tech') ||
               page.includes('tech') || tag.includes('tech');
    }

    function getEditorRoute(article) {
        return isTechArticle(article) ? EDITORS.tech : EDITORS.cyber;
    }
    /* ======================================== */

    function getGitHubConfig() {
        const settings = JSON.parse(localStorage.getItem('dyve-settings') || '{}');
        return {
            token: settings.githubToken || '',
            repo: settings.githubRepo || '',
            branch: settings.githubBranch || 'main',
            siteUrl: settings.siteUrl || 'https://dyve.online'
        };
    }

    function showToast(message, duration = 3000) {
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        if (!toast || !toastMessage) return;

        toastMessage.textContent = message;
        toast.classList.remove('hidden', 'translate-y-4', 'opacity-0');
        setTimeout(() => {
            toast.classList.add('translate-y-4', 'opacity-0');
            setTimeout(() => toast.classList.add('hidden'), 300);
        }, duration);
    }

    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function b64ToUtf8(b64) {
        try {
            const bin = atob(b64.replace(/\s/g, ''));
            const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
            return new TextDecoder().decode(bytes);
        } catch (e) {
            console.error('Base64 decode error:', e);
            return '';
        }
    }

    async function fetchArticlesText(config) {
        if (!config.repo || !config.token) throw new Error('GitHub configuration incomplete');

        const apiUrl = `https://api.github.com/repos/${config.repo}/contents/assets/articles.json?ref=${config.branch}`;

        try {
            const res = await fetch(apiUrl, {
                headers: {
                    'Authorization': `token ${config.token}`,
                    'Accept': 'application/vnd.github+json'
                }
            });

            if (res.status === 404) throw new Error(`articles.json not found on ${config.repo}@${config.branch}`);
            if (res.status === 401 || res.status === 403) throw new Error(`GitHub authentication failed (${res.status})`);
            if (!res.ok) throw new Error(`GitHub API error: ${res.status} ${res.statusText}`);

            const data = await res.json();
            let text = '';

            if (data && typeof data.content === 'string' && data.content.trim()) {
                text = b64ToUtf8(data.content);
            }

            if (!text) {
                const rawRes = await fetch(`https://raw.githubusercontent.com/${config.repo}/${config.branch}/assets/articles.json`);
                if (rawRes.ok) text = await rawRes.text();
            }

            return (text || '').trim();
        } catch (error) {
            if (error instanceof TypeError) throw new Error('Network error - check your connection');
            throw error;
        }
    }

    async function loadPublishedArticles() {
        const config = getGitHubConfig();
        const container = document.getElementById('publishedList');
        const emptyState = document.getElementById('emptyState');
        const refreshIcon = document.getElementById('refreshIcon');
        const countEl = document.getElementById('articleCount');

        if (!container || !emptyState || !refreshIcon || !countEl) return;

        allArticles = [];
        filteredArticles = [];
        clearSelection(); // Reset selection on reload
        
        container.innerHTML = '<div class="skeleton h-32 rounded-lg"></div>'.repeat(3);
        emptyState.classList.add('hidden');

        if (!config.token || !config.repo) {
            container.innerHTML = '';
            emptyState.classList.remove('hidden');
            emptyState.querySelector('h3').textContent = 'GitHub not configured';
            emptyState.querySelector('p').textContent = 'Please configure your GitHub settings first.';
            const a = emptyState.querySelector('a');
            a.textContent = 'Go to Settings';
            a.href = 'settings.html';
            countEl.textContent = '0 articles';
            return;
        }

        refreshIcon.classList.add('animate-spin');

        try {
            const text = await fetchArticlesText(config);

            if (!text) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                emptyState.querySelector('h3').textContent = 'No articles found';
                emptyState.querySelector('p').textContent = 'The articles.json file is empty or missing. Publish some articles from the editor.';
                const a = emptyState.querySelector('a');
                a.textContent = 'Create Article';
                a.href = EDITORS.fallback;
                countEl.textContent = '0 articles';
                return;
            }

            try {
                allArticles = JSON.parse(text);
            } catch (e) {
                throw new Error(`Invalid JSON in articles.json: ${e.message}`);
            }

            if (!Array.isArray(allArticles)) throw new Error('articles.json must contain an array');

            filteredArticles = [...allArticles];
            countEl.textContent = `${allArticles.length} article${allArticles.length !== 1 ? 's' : ''} published`;
            renderArticles(filteredArticles);

        } catch (error) {
            console.error('Error loading articles:', error);
            container.innerHTML = `
                <div class="text-center py-12 bg-white rounded-lg border border-gray-200">
                    <svg class="w-12 h-12 mx-auto text-red-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <p class="text-gray-900 font-medium mb-1">Failed to load intel feed</p>
                    <p class="text-sm text-gray-500 mb-4">${escapeHtml(error.message)}</p>
                    <button onclick="loadPublishedArticles()" class="text-dyve-accent hover:text-dyve-accentHover font-semibold text-sm">Try Again</button>
                </div>
            `;
            countEl.textContent = 'Error loading';
        } finally {
            refreshIcon.classList.remove('animate-spin');
        }
    }

    function renderArticles(articles) {
        const container = document.getElementById('publishedList');
        const emptyState = document.getElementById('emptyState');
        if (!container || !emptyState) return;

        if (!articles || articles.length === 0) {
            container.innerHTML = '';
            emptyState.classList.remove('hidden');
            emptyState.querySelector('h3').textContent = 'No matching articles';
            emptyState.querySelector('p').textContent = 'Try adjusting your search or publish new articles.';
            const a = emptyState.querySelector('a');
            a.textContent = 'Create Article';
            a.href = EDITORS.fallback;
            return;
        }

        emptyState.classList.add('hidden');
        const siteUrl = getGitHubConfig().siteUrl;

        container.innerHTML = articles.map((article) => {
            const originalIndex = allArticles.indexOf(article);
            const viewUrl = article.url ? `${siteUrl}/${article.url}` : '#';

            const d = article.date ? new Date(article.date) : null;
            const dateStr = (d && !isNaN(d)) ? d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : 'Recent';

            const categoryColors = {
                'breach': 'bg-red-50 text-red-700 border-red-200',
                'dark-web': 'bg-purple-50 text-purple-700 border-purple-200',
                'ransomware': 'bg-orange-50 text-orange-700 border-orange-200',
                'threat-actors': 'bg-pink-50 text-pink-700 border-pink-200',
                'signals': 'bg-blue-50 text-blue-700 border-blue-200',
                'analysis': 'bg-cyan-50 text-cyan-700 border-cyan-200',
                'tech': 'bg-emerald-50 text-emerald-700 border-emerald-200'
            };
            const badgeClass = categoryColors[article.category] || 'bg-gray-50 text-gray-700 border-gray-200';
            const categoryLabel = article.category ? article.category.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase()) : 'General';

            const safeTitle = escapeHtml(article.title || 'Untitled');
            const safeDesc = escapeHtml(article.desc || 'No description available.');
            const fallbackImg = 'https://placehold.co/400x300/00ffaa/ffffff?text=Dyve+Intel';
            const isChecked = selectedIndices.includes(originalIndex) ? 'checked' : '';

            return `
                <div class="article-card relative bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden flex flex-col sm:flex-row group">
                    
                    <!-- Checkbox for Bulk Actions -->
                    <div class="absolute top-3 left-3 z-20 bg-white/80 rounded backdrop-blur-sm p-1 leading-none">
                        <input type="checkbox" class="article-checkbox w-5 h-5 accent-dyve-accent border-gray-300 rounded cursor-pointer" 
                               onchange="toggleSelect(${originalIndex}, this)" 
                               id="check-${originalIndex}" ${isChecked}>
                    </div>

                    <div class="thumbnail-container sm:w-48 h-48 sm:h-auto flex-shrink-0 bg-gray-100">
                        <img src="${article.image || fallbackImg}"
                             alt="${safeTitle}"
                             class="w-full h-full object-cover"
                             loading="lazy"
                             onerror="this.src='${fallbackImg}'">
                    </div>

                    <div class="flex-1 p-5 flex flex-col justify-between">
                        <div>
                            <div class="flex items-center gap-2 mb-2 flex-wrap">
                                <span class="inline-block px-2.5 py-0.5 text-xs font-bold uppercase tracking-wider rounded border ${badgeClass}">
                                    ${escapeHtml(article.tag || 'INTEL')}
                                </span>
                                <span class="text-xs text-gray-500 font-medium">${categoryLabel}</span>
                                ${article.page && article.page !== 'homepage' ? `<span class="text-xs text-dyve-accent font-semibold">• ${escapeHtml(String(article.page).toUpperCase())}</span>` : ''}
                            </div>
                            <h3 class="text-lg font-bold text-gray-900 leading-tight mb-2 line-clamp-2 group-hover:text-dyve-accent transition-colors">
                                <a href="${viewUrl}" target="_blank" class="hover:underline decoration-dyve-accent decoration-2 underline-offset-2">${safeTitle}</a>
                            </h3>
                            <p class="text-sm text-gray-600 line-clamp-2 mb-3">${safeDesc}</p>
                        </div>

                        <div class="flex items-center justify-between pt-3 border-t border-gray-100">
                            <div class="flex items-center gap-3 text-xs text-gray-500">
                                <span class="flex items-center gap-1">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                    ${dateStr}
                                </span>
                                <span>•</span>
                                <span>${escapeHtml(article.meta || 'Active')}</span>
                            </div>

                            <div class="flex items-center gap-1">
                                <button onclick="editArticle(${originalIndex})" class="p-2 text-gray-400 hover:text-dyve-accent hover:bg-dyve-accent/10 rounded-lg transition-all" title="Edit Article">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                                    </svg>
                                </button>
                                <button onclick="deleteArticle(${originalIndex})" class="p-2 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-all" title="Delete Article">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                    </svg>
                                </button>
                                <a href="${viewUrl}" target="_blank" class="p-2 text-gray-400 hover:text-dyve-accent hover:bg-dyve-accent/10 rounded-lg transition-all" title="View Live">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                                    </svg>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    /* ============ BULK ACTIONS LOGIC ============ */
    
    function toggleSelect(index, checkbox) {
        if (checkbox.checked) {
            if (selectedIndices.length >= 5) {
                checkbox.checked = false;
                showToast('⚠️ You can only select up to 5 articles at once');
                return;
            }
            if (!selectedIndices.includes(index)) selectedIndices.push(index);
        } else {
            selectedIndices = selectedIndices.filter(i => i !== index);
        }
        updateBulkActionBar();
    }

    function updateBulkActionBar() {
        const bar = document.getElementById('bulkActionBar');
        const count = document.getElementById('bulkCount');
        
        if (selectedIndices.length > 0) {
            bar.classList.remove('hidden');
            void bar.offsetWidth; // trigger reflow for animation
            bar.classList.remove('-translate-y-10', 'opacity-0');
            count.textContent = `${selectedIndices.length} selected (Max 5)`;
        } else {
            bar.classList.add('-translate-y-10', 'opacity-0');
            setTimeout(() => { 
                if(selectedIndices.length === 0) bar.classList.add('hidden'); 
            }, 300);
        }
    }

    function clearSelection() {
        selectedIndices = [];
        document.querySelectorAll('.article-checkbox').forEach(cb => cb.checked = false);
        updateBulkActionBar();
    }

    async function bulkDelete() {
        if (selectedIndices.length === 0) return;
        if (!confirm(`Are you sure you want to permanently delete ${selectedIndices.length} articles? This cannot be undone.`)) return;

        const config = getGitHubConfig();
        showToast('🗑️ Deleting selected articles...');

        try {
            const fetchRes = await fetch(
                `https://api.github.com/repos/${config.repo}/contents/assets/articles.json?ref=${config.branch}`,
                { headers: { 'Authorization': `token ${config.token}`, 'Accept': 'application/vnd.github+json' } }
            );

            if (!fetchRes.ok) throw new Error(`Failed to fetch file: ${fetchRes.status}`);

            const jsonData = await fetchRes.json();
            if (!jsonData.content || !jsonData.sha) throw new Error('File content/sha not available');

            const articles = JSON.parse(b64ToUtf8(jsonData.content));

            // Sort indices descending so deleting one doesn't shift the index of the next
            selectedIndices.sort((a, b) => b - a);
            selectedIndices.forEach(idx => {
                if (idx >= 0 && idx < articles.length) {
                    articles.splice(idx, 1);
                }
            });

            const bytes = new TextEncoder().encode(JSON.stringify(articles, null, 2));
            const jsonBase64 = btoa(String.fromCharCode(...bytes));

            const updateRes = await fetch(
                `https://api.github.com/repos/${config.repo}/contents/assets/articles.json`,
                {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${config.token}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/vnd.github+json'
                    },
                    body: JSON.stringify({
                        message: `chore: bulk delete ${selectedIndices.length} articles`,
                        content: jsonBase64,
                        sha: jsonData.sha,
                        branch: config.branch
                    })
                }
            );

            if (!updateRes.ok) throw new Error(`Failed to save changes: ${updateRes.status}`);

            showToast(`✅ ${selectedIndices.length} articles deleted successfully!`);
            clearSelection();
            await loadPublishedArticles();

        } catch (error) {
            console.error('Bulk delete error:', error);
            showToast('❌ Error deleting articles: ' + error.message);
        }
    }


    /* ============ SEARCH ============ */
    document.getElementById('searchInput')?.addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase().trim();

        if (!term) {
            filteredArticles = [...allArticles];
        } else {
            filteredArticles = allArticles.filter(a =>
                (a.title || '').toLowerCase().includes(term) ||
                (a.desc || '').toLowerCase().includes(term) ||
                (a.category || '').toLowerCase().includes(term) ||
                (a.tag || '').toLowerCase().includes(term)
            );
        }
        renderArticles(filteredArticles);
    });

    /* ============ EDIT — SMART ROUTING ============ */
    function editArticle(index) {
        if (index < 0 || index >= allArticles.length) {
            showToast('❌ Article not found');
            return;
        }

        const article = allArticles[index];
        const isTech = isTechArticle(article);
        const target = getEditorRoute(article);

        const editData = {
            title: article.title || '',
            desc: article.desc || '',
            category: article.category || '',
            tag: article.tag || '',
            meta: article.meta || '',
            image: article.image || '',
            page: article.page || 'homepage',
            index: index,
            slug: article.url ? article.url.replace(/.*\/(.*)\.html$/, '$1') : '',
            content: article.content || null
        };

        try {
            localStorage.setItem(EDIT_KEY, JSON.stringify(editData));
            showToast(isTech ? '📥 Opening in Tech Editor...' : '🔐 Opening in HackaX Editor...');
            setTimeout(() => { window.location.href = `${target}?mode=edit`; }, 400);
        } catch (e) {
            showToast('❌ Error preparing edit: ' + e.message);
        }
    }

    // Delete Single Article
    async function deleteArticle(index) {
        if (index < 0 || index >= allArticles.length) {
            showToast('❌ Article not found');
            return;
        }

        if (!confirm('Are you sure you want to permanently delete this article? This cannot be undone.')) return;

        const config = getGitHubConfig();
        showToast('🗑️ Deleting article...');

        try {
            const fetchRes = await fetch(
                `https://api.github.com/repos/${config.repo}/contents/assets/articles.json?ref=${config.branch}`,
                { headers: { 'Authorization': `token ${config.token}`, 'Accept': 'application/vnd.github+json' } }
            );

            if (!fetchRes.ok) throw new Error(`Failed to fetch file: ${fetchRes.status}`);

            const jsonData = await fetchRes.json();
            if (!jsonData.content || !jsonData.sha) throw new Error('File content/sha not available');

            const articles = JSON.parse(b64ToUtf8(jsonData.content));
            if (!Array.isArray(articles) || index >= articles.length) throw new Error('Invalid article index');

            const deleted = articles.splice(index, 1)[0];

            const bytes = new TextEncoder().encode(JSON.stringify(articles, null, 2));
            const jsonBase64 = btoa(String.fromCharCode(...bytes));

            const updateRes = await fetch(
                `https://api.github.com/repos/${config.repo}/contents/assets/articles.json`,
                {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${config.token}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/vnd.github+json'
                    },
                    body: JSON.stringify({
                        message: `chore: delete article - ${deleted.title || 'Untitled'}`,
                        content: jsonBase64,
                        sha: jsonData.sha,
                        branch: config.branch
                    })
                }
            );

            if (!updateRes.ok) throw new Error(`Failed to save changes: ${updateRes.status}`);

            showToast('✅ Article deleted successfully!');
            await loadPublishedArticles();

        } catch (error) {
            console.error('Delete error:', error);
            showToast('❌ Error deleting article: ' + error.message);
        }
    }

    // Sticky menu
    const menuToggle = document.getElementById('menuToggle');
    const slideMenu = document.getElementById('slideMenu');
    const menuIcon = document.getElementById('menuIcon');
    let menuOpen = false;

    if (menuToggle && slideMenu && menuIcon) {
        menuToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            menuOpen = !menuOpen;
            if (menuOpen) {
                slideMenu.classList.remove('translate-y-4', 'opacity-0', 'pointer-events-none');
                slideMenu.classList.add('translate-y-0', 'opacity-100', 'pointer-events-auto');
                menuIcon.style.transform = 'rotate(90deg)';
            } else {
                slideMenu.classList.add('translate-y-4', 'opacity-0', 'pointer-events-none');
                slideMenu.classList.remove('translate-y-0', 'opacity-100', 'pointer-events-auto');
                menuIcon.style.transform = 'rotate(0deg)';
            }
        });

        document.addEventListener('click', (e) => {
            const stickyMenu = document.getElementById('stickyMenu');
            if (stickyMenu && !stickyMenu.contains(e.target) && menuOpen) menuToggle.click();
        });
    }

    document.getElementById('refreshBtn')?.addEventListener('click', () => {
        loadPublishedArticles();
        showToast('🔄 Refreshing feed...');
    });

    // Initialize
    loadPublishedArticles();
</script>

    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
