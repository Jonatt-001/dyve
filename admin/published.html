<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Published - Dyve HackaX Dashboard</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020403">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dyve: {
                            bg: '#020403',
                            accent: '#00ffaa',
                            accentHover: '#00cc88',
                            muted: 'rgba(255,255,255,0.6)'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen">
    
    <!-- HEADER -->
    <header class="bg-dyve-bg border-b border-white/10 sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="index.html" class="text-dyve-muted hover:text-dyve-accent transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                </a>
                <h1 class="text-xl font-bold text-white tracking-wide">DYVE<span class="text-dyve-accent">|</span>PUBLISHED</h1>
            </div>
            <button id="refreshBtn" class="text-dyve-muted hover:text-dyve-accent transition-colors p-2 hover:bg-white/5 rounded-lg" title="Refresh Feed">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
            </button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div id="publishedList" class="space-y-4">
            <div class="text-center py-12">
                <div class="animate-spin w-8 h-8 border-4 border-dyve-accent border-t-transparent rounded-full mx-auto mb-4"></div>
                <p class="text-gray-500">Loading intelligence feed...</p>
            </div>
        </div>
    </main>

    <!-- STICKY BOTTOM MENU -->
    <div id="stickyMenu" class="fixed bottom-6 right-6 z-50">
        <button id="menuToggle" class="w-14 h-14 bg-dyve-accent text-dyve-bg rounded-full shadow-lg flex items-center justify-center hover:bg-dyve-accentHover transition-all duration-300 active:scale-95">
            <svg id="menuIcon" class="w-6 h-6 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>

        <div id="slideMenu" class="absolute bottom-20 right-0 bg-white rounded-lg shadow-2xl overflow-hidden transform translate-y-4 opacity-0 pointer-events-none transition-all duration-300 w-56 border border-gray-200">
            <nav class="py-2">
                <a href="settings.html" class="flex items-center gap-3 px-4 py-3 hover:bg-gray-50 transition-colors">
                    <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    <span class="text-sm font-medium text-gray-700">Settings</span>
                </a>
                <a href="drafts.html" class="flex items-center gap-3 px-4 py-3 hover:bg-gray-50 transition-colors">
                    <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    <span class="text-sm font-medium text-gray-700">Drafts</span>
                </a>
                <a href="published.html" class="flex items-center gap-3 px-4 py-3 bg-gray-50">
                    <svg class="w-5 h-5 text-dyve-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span class="text-sm font-medium text-dyve-accent">Published</span>
                </a>
            </nav>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="fixed bottom-24 right-4 bg-dyve-bg text-white border border-dyve-accent/30 px-6 py-3 rounded-lg shadow-2xl hidden z-50 flex items-center gap-2">
        <span id="toastMessage"></span>
    </div>

    <script>
        // Load published articles from GitHub (via articles.json)
        async function loadPublishedArticles() {
            const settings = JSON.parse(localStorage.getItem('dyve-settings') || '{}');
            const container = document.getElementById('publishedList');

            if (!settings.githubToken || !settings.githubRepo) {
                container.innerHTML = `
                    <div class="text-center py-12">
                        <svg class="w-16 h-16 mx-auto text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                        </svg>
                        <p class="text-gray-500 mb-4">GitHub not configured</p>
                        <a href="settings.html" class="text-dyve-accent hover:underline font-medium">Configure GitHub</a>
                    </div>
                `;
                return;
            }

            // Show loading state
            container.innerHTML = `
                <div class="text-center py-12">
                    <div class="animate-spin w-8 h-8 border-4 border-dyve-accent border-t-transparent rounded-full mx-auto mb-4"></div>
                    <p class="text-gray-500">Loading intelligence feed...</p>
                </div>
            `;

            try {
                // Fetch the articles.json file directly from GitHub
                const response = await fetch(`https://api.github.com/repos/${settings.githubRepo}/contents/assets/articles.json?ref=${settings.githubBranch || 'main'}`, {
                    headers: { 'Authorization': `token ${settings.githubToken}` }
                });

                if (!response.ok) {
                    throw new Error('Failed to fetch articles.json');
                }

                const data = await response.json();
                const articles = JSON.parse(atob(data.content));

                if (!articles || articles.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-12">
                            <svg class="w-16 h-16 mx-auto text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                            </svg>
                            <p class="text-gray-500">No published intel yet</p>
                        </div>
                    `;
                    return;
                }

                // Render articles
                container.innerHTML = articles.map((article, index) => {
                    const slug = article.url ? article.url.replace('article/', '').replace('.html', '') : 'unknown';
                    const viewUrl = `${settings.siteUrl || 'https://dyve.online'}/${article.url || '#'}`;
                    const dateStr = article.date ? new Date(article.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : 'Recent';

                    return `
                        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 hover:shadow-md hover:border-dyve-accent/30 transition-all duration-300 relative group">
                            <!-- Action Buttons -->
                            <div class="absolute top-4 right-4 flex gap-2 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity">
                                <button onclick="editArticle(${index})" class="p-2 text-gray-400 hover:text-dyve-accent hover:bg-dyve-accent/10 rounded-lg transition-all" title="Edit Article">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                                    </svg>
                                </button>
                                <button onclick="deleteArticle(${index})" class="p-2 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-all" title="Delete Article">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                    </svg>
                                </button>
                            </div>
                            
                            <div class="flex justify-between items-start mb-3 pr-16">
                                <div class="flex-1">
                                    <div class="flex items-center gap-2 mb-2">
                                        <span class="inline-block px-2 py-1 text-xs font-bold uppercase tracking-wider text-dyve-bg bg-dyve-accent rounded">${article.tag || 'INTEL'}</span>
                                        <span class="text-xs text-gray-500 capitalize">${article.category || 'general'}</span>
                                    </div>
                                    <h3 class="text-lg font-bold text-gray-900 leading-tight">${article.title}</h3>
                                </div>
                            </div>
                            <p class="text-sm text-gray-600 mb-4 line-clamp-2">${article.desc}</p>
                            <div class="flex items-center justify-between text-xs text-gray-500 border-t border-gray-100 pt-3">
                                <span>${dateStr} • ${article.meta || 'Active'}</span>
                                <a href="${viewUrl}" target="_blank" class="flex items-center gap-1 text-dyve-accent hover:text-dyve-accentHover font-semibold transition-colors">
                                    View Intel
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                                </a>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                console.error('Error loading articles:', error);
                container.innerHTML = `
                    <div class="text-center py-12">
                        <svg class="w-16 h-16 mx-auto text-red-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        <p class="text-gray-500 mb-2">Failed to load intel feed</p>
                        <p class="text-sm text-gray-400">${error.message}</p>
                        <button onclick="loadPublishedArticles()" class="mt-4 text-dyve-accent hover:underline text-sm font-medium">Try Again</button>
                    </div>
                `;
            }
        }

        // Toast notification
        function showToast(message, duration = 3000) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), duration);
        }

        // Sticky menu
        const menuToggle = document.getElementById('menuToggle');
        const slideMenu = document.getElementById('slideMenu');
        const menuIcon = document.getElementById('menuIcon');
        let menuOpen = false;

        menuToggle.addEventListener('click', () => {
            menuOpen = !menuOpen;
            if (menuOpen) {
                slideMenu.classList.remove('translate-y-4', 'opacity-0', 'pointer-events-none');
                slideMenu.classList.add('translate-y-0', 'opacity-100', 'pointer-events-auto');
                menuIcon.style.transform = 'rotate(90deg)';
            } else {
                slideMenu.classList.add('translate-y-4', 'opacity-0', 'pointer-events-none');
                slideMenu.classList.remove('translate-y-0', 'opacity-100', 'pointer-events-auto');
                menuIcon.style.transform = 'rotate(0deg)';
            }
        });

        document.addEventListener('click', (e) => {
            if (!document.getElementById('stickyMenu').contains(e.target) && menuOpen) {
                menuToggle.click();
            }
        });

        // Refresh button
        document.getElementById('refreshBtn').addEventListener('click', () => {
            loadPublishedArticles();
            showToast('🔄 Refreshing feed...');
        });

        // Edit article function (Perfectly syncs with new Editor features)
        function editArticle(index) {
            const settings = JSON.parse(localStorage.getItem('dyve-settings') || '{}');
            
            showToast('📥 Loading article data...');
            
            fetch(`https://api.github.com/repos/${settings.githubRepo}/contents/assets/articles.json?ref=${settings.githubBranch || 'main'}`, {
                headers: { 'Authorization': `token ${settings.githubToken}` }
            })
            .then(res => res.json())
            .then(data => {
                const articles = JSON.parse(atob(data.content));
                const article = articles[index];
                
                // Store ALL article data for editor to pre-fill (including image URL for Cloudinary preview)
                localStorage.setItem('dyve-edit-article', JSON.stringify({
                    title: article.title,
                    desc: article.desc,
                    category: article.category,
                    tag: article.tag,
                    meta: article.meta,
                    image: article.image, // Crucial for pre-filling the featured image preview
                    index: index,
                    slug: article.url.replace('article/', '').replace('.html', '')
                }));
                
                // Redirect to editor
                window.location.href = 'index.html?mode=edit';
            })
            .catch(error => {
                console.error('Error loading article:', error);
                showToast('❌ Failed to load article for editing');
            });
        }

        // Delete article function
        async function deleteArticle(index) {
            if (!confirm('Are you sure you want to permanently delete this article? This cannot be undone.')) {
                return;
            }

            const settings = JSON.parse(localStorage.getItem('dyve-settings') || '{}');
            showToast('🗑️ Deleting article...');

            try {
                // 1. Fetch current articles.json
                const fetchRes = await fetch(`https://api.github.com/repos/${settings.githubRepo}/contents/assets/articles.json?ref=${settings.githubBranch || 'main'}`, {
                    headers: { 'Authorization': `token ${settings.githubToken}` }
                });
                
                const jsonData = await fetchRes.json();
                const articles = JSON.parse(atob(jsonData.content));
                
                // 2. Remove the article at the specified index
                const deletedArticle = articles.splice(index, 1)[0];
                
                // 3. Push updated articles.json to GitHub
                const newJsonContent = JSON.stringify(articles, null, 2);
                const jsonBase64 = btoa(unescape(encodeURIComponent(newJsonContent)));
                
                await fetch(`https://api.github.com/repos/${settings.githubRepo}/contents/assets/articles.json`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${settings.githubToken}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: `chore: delete article - ${deletedArticle.title}`, 
                        content: jsonBase64, 
                        sha: jsonData.sha, 
                        branch: settings.githubBranch || 'main' 
                    })
                });

                showToast('✅ Article deleted successfully!');
                loadPublishedArticles(); // Refresh the list

            } catch (error) {
                console.error('Delete error:', error);
                showToast('❌ Error deleting article: ' + error.message);
            }
        }

        // Initialize
        loadPublishedArticles();
    </script>
</body>
</html>
