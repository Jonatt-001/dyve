    <style>
        * { box-sizing: border-box; }
        body { 
            background-color: #fffdfa; 
            overflow-x: hidden; 
            width: 100%; 
            font-family: 'Inter', sans-serif;
        }
        html { overflow-x: hidden; width: 100%; overflow-y: auto; scroll-behavior: smooth; }
        main { overflow: visible; }

        .ql-editor { min-height: 400px; font-size: 16px; font-family: 'Inter', sans-serif; }
        .ql-toolbar { position: sticky; top: 0; z-index: 10; background: white; border-color: #e2e8f0 !important; }
        .ql-container { border-color: #e2e8f0 !important; border-radius: 0.5rem; }
        
        .skeleton { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* FAB Button */
        .fab-button {
            position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px; border-radius: 50%;
            background: linear-gradient(135deg, #f15e50 0%, #d94a3e 100%); color: white; border: none;
            box-shadow: 0 4px 20px rgba(241, 94, 80, 0.4); cursor: pointer; z-index: 1000;
            display: flex; align-items: center; justify-content: center; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .fab-button:hover { transform: scale(1.1) rotate(90deg); box-shadow: 0 6px 25px rgba(241, 94, 80, 0.5); }
        .fab-button:active { transform: scale(0.95); }

        /* FAB Drawer */
        .fab-drawer {
            position: fixed; bottom: 90px; right: 24px; background: white; border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15); padding: 12px 0; min-width: 220px;
            opacity: 0; visibility: hidden; transform: translateY(20px) scale(0.95);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 999; border: 1px solid rgba(0, 0, 0, 0.05);
        }
        .fab-drawer.active { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }
        .fab-drawer-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 20px; color: #00001a;
            text-decoration: none; font-size: 14px; font-weight: 500; transition: all 0.2s; cursor: pointer;
            border: none; background: none; width: 100%; text-align: left;
        }
        .fab-drawer-item:hover { background-color: #fef3f2; color: #f15e50; }
        .fab-drawer-item svg { width: 20px; height: 20px; flex-shrink: 0; }
        .fab-drawer-divider { height: 1px; background: #f3f4f6; margin: 8px 0; }

        /* Overlay */
        .fab-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.3);
            opacity: 0; visibility: hidden; transition: all 0.3s; z-index: 998;
        }
        .fab-overlay.active { opacity: 1; visibility: visible; }

        /* Mobile optimizations */
        @media (max-width: 768px) {
            .fab-button { bottom: 20px; right: 20px; width: 52px; height: 52px; }
            .fab-drawer { bottom: 82px; right: 20px; min-width: 200px; border-radius: 12px; }
            .fab-drawer-item { padding: 14px 16px; font-size: 15px; }
            main { padding: 16px !important; max-width: 100% !important; }
            .grid { grid-template-columns: 1fr !important; gap: 16px !important; }
        }
        @media (hover: none) and (pointer: coarse) {
            .fab-drawer-item { padding: 16px 20px; min-height: 48px; }
            .fab-button { width: 60px; height: 60px; }
        }
        @supports (-webkit-touch-callout: none) {
            .fab-button { bottom: calc(24px + env(safe-area-inset-bottom)); }
            .fab-drawer { bottom: calc(90px + env(safe-area-inset-bottom)); }
        }
    }

<script>
let currentDraftId = null;
let quill = null;

// ====== NEW: Edit-mode state ======
let editingArticleIndex = null;    // null = new article, number = updating existing
let editingOriginalSlug = null;    // original slug, used to detect renames

const CLOUDINARY_CONFIG = {
    cloudName: 'dxdbn6xwy',
    uploadPreset: 'geefox_unsigned',
    endpoint: 'https://api.cloudinary.com/v1_1/dxdbn6xwy/image/upload'
};



function b64ToUtf8(b64) {
    const bin = atob(b64.replace(/\s/g, ''));
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    return new TextDecoder().decode(bytes);
}

// Chunked encoder — safe for files > 1MB (no spread-arg stack overflow)
function utf8ToBase64(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = '';
    const CHUNK = 0x8000;
    for (let i = 0; i < bytes.length; i += CHUNK) {
        bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
    }
    return btoa(bin);
}

// Bulletproof articles.json reader: metadata+sha from Contents API,
// body from base64 OR raw fallback (>1MB), empty/corrupt handled.
async function fetchArticlesJson(config) {
    const metaRes = await fetch(
        `https://api.github.com/repos/${config.repo}/contents/assets/articles.json?ref=${config.branch}`,
        { headers: { 'Authorization': `token ${config.token}`, 'Accept': 'application/vnd.github+json' } }
    );

    if (metaRes.status === 404) return { articles: [], sha: '' };
    if (!metaRes.ok) {
        const err = await metaRes.json().catch(() => ({}));
        throw new Error(`articles.json fetch failed: ${err.message || metaRes.status}`);
    }

    const meta = await metaRes.json();
    const sha = meta.sha || '';
    let text = '';

    if (typeof meta.content === 'string' && meta.content.trim()) {
        text = b64ToUtf8(meta.content);
    } else {
        // content omitted => file >1MB (or empty) → use raw endpoint
        const rawRes = await fetch(
            `https://raw.githubusercontent.com/${config.repo}/${config.branch}/assets/articles.json`,
            { headers: { 'Authorization': `token ${config.token}` } }
        );
        if (rawRes.ok) text = await rawRes.text();
    }

    text = (text || '').trim();
    if (!text) return { articles: [], sha };   // truly empty file → start fresh

    let articles;
    try { articles = JSON.parse(text); }
    catch (e) { throw new Error('articles.json is corrupt — restore or reset it on GitHub'); }
    if (!Array.isArray(articles)) articles = [];

    return { articles, sha };
}

// ==========================================
// CORE FUNCTIONS
// ==========================================
function getGitHubConfig() {
    try {
        const settings = JSON.parse(localStorage.getItem('dyve-settings') || '{}');
        return {
            token: settings.githubToken || '',
            repo: settings.githubRepo || '',
            branch: settings.githubBranch || 'main',
            siteUrl: settings.siteUrl || 'https://dyve.online'
        };
    } catch (e) {
        console.error('Error reading settings:', e);
        return { token: '', repo: '', branch: 'main', siteUrl: 'https://dyve.online' };
    }
}

async function loadEditData() {
    const params = new URLSearchParams(window.location.search);
    if (params.get('mode') !== 'edit') return;

    const raw = localStorage.getItem('dyve-edit-article');
    if (!raw) {
        showToast('⚠️ No article data found for editing');
        history.replaceState({}, '', window.location.pathname);
        return;
    }

    try {
        const edit = JSON.parse(raw);
        editingArticleIndex = typeof edit.index === 'number' ? edit.index : null;
        editingOriginalSlug = edit.slug || null;

        // Prefill basic fields
        document.getElementById('titleInput').value = edit.title || '';
        document.getElementById('descriptionInput').value = edit.desc || '';
        document.getElementById('imageUrlInput').value = edit.image || '';

        // Category (published.meta = category id; fallback to published.category)
        const catId = edit.meta || edit.category || '';
        if (catId) document.getElementById('categorySelect').value = catId;

        // Content type (published.tag = "News" / "Tutorial" etc.)
        if (edit.tag) document.getElementById('contentTypeSelect').value = edit.tag;

        // Image preview
        if (edit.image) {
            document.getElementById('featuredImagePreviewImg').src = edit.image;
            document.getElementById('featuredImagePreview').classList.remove('hidden');
        }

        // Try restoring Quill content
        let contentRestored = false;
        if (edit.content && quill) {
            try {
                const parsed = typeof edit.content === 'string' ? JSON.parse(edit.content) : edit.content;
                if (parsed && parsed.ops) {
                    quill.setContents(parsed);
                    contentRestored = true;
                }
            } catch (e) { console.warn('Could not parse stored Quill content:', e); }
        }

        // If content wasn't in localStorage, fetch it from GitHub
        if (!contentRestored && quill && editingArticleIndex !== null) {
            try {
                const config = getGitHubConfig();
                if (config.token && config.repo) {
                    showToast('⏳ Loading article content...');
                    const res = await fetch(
                        `https://api.github.com/repos/${config.repo}/contents/assets/articles.json?ref=${config.branch}`,
                        { headers: { 'Authorization': `token ${config.token}` } }
                    );
                    if (res.ok) {
                        const data = await res.json();
                        const bin = atob(data.content.replace(/\s/g, ''));
                        const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
                        const text = new TextDecoder().decode(bytes);
                        const articles = JSON.parse(text);
                        const article = articles[editingArticleIndex];
                        if (article && article.content) {
                            try {
                                const parsed = typeof article.content === 'string' ? JSON.parse(article.content) : article.content;
                                if (parsed && parsed.ops) { quill.setContents(parsed); contentRestored = true; }
                            } catch (e) { console.warn('Could not parse fetched Quill content:', e); }
                        }
                    }
                }
            } catch (e) { console.warn('Could not fetch article content from GitHub:', e); }
        }

        // Trigger preview updates
        document.getElementById('titleInput').dispatchEvent(new Event('input'));
        document.getElementById('descriptionInput').dispatchEvent(new Event('input'));

        // Clear the edit key so refresh doesn't re-trigger
        localStorage.removeItem('dyve-edit-article');

        // Strip ?mode=edit from URL
        history.replaceState({}, '', window.location.pathname);

        showToast(editingArticleIndex !== null
            ? `📝 Editing: ${edit.title || 'article'}`
            : '📝 Article loaded');

    } catch (e) {
        console.error('Failed to load edit data:', e);
        showToast('❌ Failed to load article data');
        localStorage.removeItem('dyve-edit-article');
    }
}

async function handleFeaturedImageUpload(event) {
    const files = event.target.files;
    if (files.length === 0) return;

    showToast('📤 Uploading image...');
    const file = files[0];

    try {
        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', CLOUDINARY_CONFIG.uploadPreset);
        formData.append('tags', 'dyve-tech');

        const response = await fetch(CLOUDINARY_CONFIG.endpoint, { method: 'POST', body: formData });
        const data = await response.json();

        if (data.secure_url) {
            document.getElementById('imageUrlInput').value = data.secure_url;
            document.getElementById('featuredImagePreviewImg').src = data.secure_url;
            document.getElementById('featuredImagePreview').classList.remove('hidden');
            showToast('✅ Image uploaded successfully!');
        } else {
            throw new Error(data.error?.message || 'Upload failed');
        }
    } catch (error) {
        console.error('Image upload error:', error);
        showToast('❌ Image upload failed. Please try again.');
    }
}

function saveDraft() {
    const title = document.getElementById('titleInput').value.trim();
    if (!title) {
        showToast('⚠️ Please enter a title before saving draft');
        document.getElementById('titleInput').focus();
        return;
    }

    const draft = {
        id: currentDraftId || Date.now().toString(),
        title: title,
        description: document.getElementById('descriptionInput').value.trim(),
        category: document.getElementById('categorySelect').value,
        contentType: document.getElementById('contentTypeSelect').value,
        imageUrl: document.getElementById('imageUrlInput').value,
        content: quill ? quill.getContents() : {},
        timestamp: currentDraftId ? (JSON.parse(localStorage.getItem('dyve-tech-drafts') || '[]').find(d => d.id === currentDraftId)?.timestamp || Date.now()) : Date.now(),
        updatedAt: Date.now()
    };

    let drafts = JSON.parse(localStorage.getItem('dyve-tech-drafts') || '[]');
    const existingIndex = drafts.findIndex(d => d.id === draft.id);

    if (existingIndex !== -1) {
        drafts[existingIndex] = draft;
    } else {
        drafts.unshift(draft);
    }

    localStorage.setItem('dyve-tech-drafts', JSON.stringify(drafts));
    currentDraftId = draft.id;
    showToast('✅ Draft saved successfully!');
}

// ==========================================
// PUBLISH (now handles both NEW and UPDATE)
// ==========================================
async function publishArticle() {
    const config = getGitHubConfig();

    if (!config.token || !config.repo) {
        showToast('❌ GitHub not configured! Redirecting to Settings...');
        setTimeout(() => window.location.href = 'settings.html', 2000);
        return;
    }

    const title = document.getElementById('titleInput').value.trim();
    const description = document.getElementById('descriptionInput').value.trim();
    const category = document.getElementById('categorySelect').value;
    const contentType = document.getElementById('contentTypeSelect').value;
    const imageUrl = document.getElementById('imageUrlInput').value;

    if (!title) return showToast('❌ Article Title is required');
    if (!description) return showToast('❌ Meta Description is required');
    if (!category) return showToast('❌ Please select a category');

    const slug = generateSlug(title);
    const today = new Date().toISOString().split('T')[0];
    const articleUrl = `tech/${slug}.html`;
    const isUpdate = editingArticleIndex !== null;

    showToast(isUpdate ? '⏳ Updating article...' : '⏳ Publishing article...');

    try {
        const articleHTML = quill ? quill.root.innerHTML : '<p>No content.</p>';
        const ogPrompt = document.getElementById('ogImagePrompt').value.trim();

        const htmlContent = generateTechArticleHTML(
            config.siteUrl, title, description,
            imageUrl || 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=800',
            contentType || 'News', category, slug, today, articleHTML, ogPrompt
        );
        const htmlBase64 = utf8ToBase64(htmlContent);

        // 1) Load articles.json (sha + raw fallback for >1MB)
        const { articles, sha: jsonSha } = await fetchArticlesJson(config);

        // 2) Build article object
        const articleObject = {
            title,
            desc: description,
            image: imageUrl || 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=800',
            url: articleUrl,
            tag: contentType || 'News',
            meta: category,
            category,
            date: today,
            page: 'tech',
            content: JSON.stringify(quill ? quill.getContents() : {})
        };

        let commitMessage;

        if (isUpdate && editingArticleIndex < articles.length) {
            // ===== UPDATE existing entry =====
            articles[editingArticleIndex] = articleObject;
            commitMessage = `chore: update tech article - ${title}`;

            // Slug changed? Delete the old HTML file
            if (editingOriginalSlug && editingOriginalSlug !== slug) {
                try {
                    const oldRes = await fetch(
                        `https://api.github.com/repos/${config.repo}/contents/tech/${editingOriginalSlug}.html?ref=${config.branch}`,
                        { headers: { 'Authorization': `token ${config.token}` } }
                    );
                    if (oldRes.ok) {
                        const oldData = await oldRes.json();
                        await fetch(
                            `https://api.github.com/repos/${config.repo}/contents/tech/${editingOriginalSlug}.html`,
                            {
                                method: 'DELETE',
                                headers: { 'Authorization': `token ${config.token}`, 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    message: `chore: rename ${editingOriginalSlug} -> ${slug}`,
                                    sha: oldData.sha,
                                    branch: config.branch
                                })
                            }
                        );
                    }
                } catch (e) { console.warn('Old file cleanup failed:', e); }
            }
        } else {
            // ===== NEW article =====
            articles.unshift(articleObject);
            commitMessage = `chore: publish tech article - ${title}`;
        }

        const jsonBase64 = utf8ToBase64(JSON.stringify(articles, null, 2));

        // 3) Upload HTML — grab existing sha first so overwrites don't 422
        let htmlSha = '';
        const existingHtml = await fetch(
            `https://api.github.com/repos/${config.repo}/contents/${articleUrl}?ref=${config.branch}`,
            { headers: { 'Authorization': `token ${config.token}` } }
        );
        if (existingHtml.ok) htmlSha = (await existingHtml.json()).sha || '';

        showToast('⏳ Uploading article file...');
        const htmlUploadRes = await fetch(
            `https://api.github.com/repos/${config.repo}/contents/${articleUrl}`,
            {
                method: 'PUT',
                headers: { 'Authorization': `token ${config.token}`, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' },
                body: JSON.stringify({
                    message: commitMessage.replace('chore:', 'feat:'),
                    content: htmlBase64,
                    branch: config.branch,
                    ...(htmlSha ? { sha: htmlSha } : {})
                })
            }
        );

        if (!htmlUploadRes.ok) {
            const err = await htmlUploadRes.json().catch(() => ({}));
            throw new Error(`HTML upload failed: ${err.message || htmlUploadRes.status}`);
        }

        // 4) Update articles.json (sha required)
        showToast('⏳ Updating article database...');
        const jsonUploadRes = await fetch(
            `https://api.github.com/repos/${config.repo}/contents/assets/articles.json`,
            {
                method: 'PUT',
                headers: { 'Authorization': `token ${config.token}`, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' },
                body: JSON.stringify({
                    message: commitMessage,
                    content: jsonBase64,
                    sha: jsonSha,
                    branch: config.branch
                })
            }
        );

        if (!jsonUploadRes.ok) {
            const err = await jsonUploadRes.json().catch(() => ({}));
            throw new Error(`Database update failed: ${err.message || jsonUploadRes.status}`);
        }

        showToast(isUpdate ? '✅ Article updated successfully!' : '✅ Published to Dyve Tech!');
        editingArticleIndex = null;
        editingOriginalSlug = null;

        setTimeout(() => {
            clearForm();
            window.location.href = '../published.html';
        }, 1500);

    } catch (error) {
        console.error('Publish/Update Error:', error);
        showToast(`❌ Failed: ${error.message}`);
    }
}

function autoGenerateMetaDescription() {
    const title = document.getElementById('titleInput').value.trim();
    const text = quill ? quill.getText().trim() : '';

    if (!title && text.length < 50) return showToast('⚠️ Add content first');

    const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 30);
    const firstSentence = sentences[0] ? sentences[0].trim() : text.substring(0, 120).trim();

    let desc = `Discover insights on ${title.toLowerCase()}. ${firstSentence.substring(0, 100)}. Learn more with Dyve Tech.`;
    if (desc.length > 160) desc = desc.substring(0, 157) + '...';

    document.getElementById('descriptionInput').value = desc;
    document.getElementById('descriptionInput').dispatchEvent(new Event('input'));
    showToast('✨ Meta description generated!');
}

function generateAutoSEO() {
    const text = quill ? quill.getText().trim() : '';
    if (text.length < 50) return showToast('⚠️ Write more content first');

    const title = document.getElementById('titleInput').value || 'Tech Article';
    const words = text.toLowerCase().match(/\b[a-z]{4,}\b/g) || [];
    const topWords = [...new Set(words)].slice(0, 3).join(', ');

    document.getElementById('titleInput').value = title;

    const firstSentence = text.split('.')[0].trim();
    const desc = `${firstSentence.substring(0, 120)}. Dyve Tech intelligence on ${topWords}.`;
    document.getElementById('descriptionInput').value = desc.length > 160 ? desc.substring(0, 157) + '...' : desc;

    document.getElementById('ogImagePrompt').value = `Modern tech visualization of ${topWords}. Clean minimalist design, gradient background, professional, high-tech aesthetic, no text.`;
    document.getElementById('descriptionInput').dispatchEvent(new Event('input'));
    showToast('✨ Auto-SEO fields generated!');
}

function analyzeSEO() {
    const title = document.getElementById('titleInput').value;
    const description = document.getElementById('descriptionInput').value;
    const content = quill ? quill.getText() : '';
    const analysis = [];

    if (!title) analysis.push({ type: 'error', message: '❌ Title required' });
    else if (title.length < 30) analysis.push({ type: 'warning', message: '⚠️ Title too short' });
    else if (title.length > 70) analysis.push({ type: 'warning', message: '⚠️ Title too long' });
    else analysis.push({ type: 'success', message: '✅ Title optimal' });

    if (!description) analysis.push({ type: 'error', message: '❌ Description required' });
    else if (description.length < 120) analysis.push({ type: 'warning', message: '⚠️ Description too short' });
    else if (description.length > 160) analysis.push({ type: 'warning', message: '⚠️ Description too long' });
    else analysis.push({ type: 'success', message: '✅ Description optimal' });

    const wordCount = content.split(/\s+/).filter(w => w).length;
    if (wordCount < 300) analysis.push({ type: 'warning', message: '⚠️ Content too short (aim for 500+)' });
    else analysis.push({ type: 'success', message: `✅ Good length (${wordCount} words)` });

    const container = document.getElementById('seoAnalysis');
    container.innerHTML = analysis.map(item => {
        const colors = { error: 'bg-red-50 text-red-800', warning: 'bg-yellow-50 text-yellow-800', success: 'bg-green-50 text-green-800' };
        return `<div class="p-3 rounded-lg ${colors[item.type]} text-sm">${item.message}</div>`;
    }).join('');
}

.body img{border-radius:6px;margin:2em auto}
.body pre{background:#f0eee8;border-radius:8px;padding:1em 1.2em;overflow:auto;margin:0 0 1.5em}
.body code{font-family:ui-monospace,Menlo,monospace;font-size:.95em}
.tags{max-width:700px;margin:56px auto 0;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.tags-label{font-size:.7rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.chip{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:#333;background:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 16px;transition:.25s}
.chip:hover{background:var(--accent);border-color:var(--accent);color:#fff;transform:translateY(-2px)}
.related{max-width:1080px;margin:76px auto 0;padding:0 20px}
.related h2{font-family:'Maven Pro',sans-serif;font-weight:800;color:var(--ink);font-size:1.4rem;margin-bottom:22px;display:flex;align-items:center;gap:14px}
.related h2::after{content:'';flex:1;height:1px;background:var(--line)}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.rcard{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;text-decoration:none;transition:.3s;display:block}
.rcard:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(0,0,26,.08)}
.rcard img{height:160px;width:100%;object-fit:cover}
.rcard .txt{padding:16px 16px 18px}
.rcard h3{font-size:.98rem;font-weight:700;color:var(--ink);line-height:1.45;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rcard time{font-size:.72rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
@media(max-width:860px){.rgrid{grid-template-columns:1fr}}
footer{margin-top:84px;background:#00001a;color:#fff;padding:46px 20px;text-align:center}
.fbrand{font-family:'Maven Pro',sans-serif;font-weight:800;letter-spacing:.06em}
.fbrand span{color:var(--accent)}
footer nav{display:flex;justify-content:center;gap:26px;margin:18px 0 14px;flex-wrap:wrap}
footer nav a{color:#9aa0b4;text-decoration:none;font-size:.85rem;letter-spacing:.06em}
footer nav a:hover{color:var(--accent)}
.copy{color:#676d80;font-size:.78rem}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-size:.85rem;font-weight:600;padding:10px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:.3s;z-index:1001}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fade{animation:fade .6s ease both}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style>

async function checkGitHubConnection() {
    const config = getGitHubConfig();
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const refreshIcon = document.getElementById('refreshIcon');

    refreshIcon.classList.add('animate-spin');
    statusText.textContent = 'Checking...';
    statusDot.className = 'w-2 h-2 rounded-full bg-yellow-500';

    if (!config.token || !config.repo) {
        statusDot.className = 'w-2 h-2 rounded-full bg-red-500';
        statusText.textContent = 'Not Configured';
        refreshIcon.classList.remove('animate-spin');
        return false;
    }

    try {
        const response = await fetch(`https://api.github.com/repos/${config.repo}`, {
            headers: { 'Authorization': `token ${config.token}` }
        });
        if (response.ok) {
            statusDot.className = 'w-2 h-2 rounded-full bg-green-500';
            statusText.textContent = 'Connected';
        } else {
            statusDot.className = 'w-2 h-2 rounded-full bg-red-500';
            statusText.textContent = 'Connection Failed';
        }
    } catch (error) {
        statusDot.className = 'w-2 h-2 rounded-full bg-red-500';
        statusText.textContent = 'Offline';
    } finally {
        refreshIcon.classList.remove('animate-spin');
    }
}

    document.getElementById('fabSaveDraft').addEventListener('click', () => { window.closeFabDrawer(); saveDraft(); });

async function fetchWithRetry(url, options = {}, retries = 2) {
    let lastErr;
    for (let i = 0; i <= retries; i++) {
        try { return await fetch(url, options); }
        catch (e) {
            lastErr = e;
            if (i < retries) await new Promise(r => setTimeout(r, 1500 * (i + 1)));
        }
    }
    throw new Error('Network error — check your connection and try again');
}

function authHeaders(config, extra = {}) {
    return Object.assign({ 'Authorization': `token ${config.token}`, 'Accept': 'application/vnd.github+json' }, extra);
}

async function githubPutFile(config, path, text, message) {
    const attempt = async () => {
        let sha = '';
        const metaRes = await fetchWithRetry(
            `https://api.github.com/repos/${config.repo}/contents/${path}?ref=${config.branch}`,
            { headers: authHeaders(config) }
        );
        if (metaRes.ok) sha = (await metaRes.json()).sha || '';

        const body = { message, content: utf8ToBase64(text), branch: config.branch };
        if (sha) body.sha = sha;

        const res = await fetch(
            `https://api.github.com/repos/${config.repo}/contents/${path}`,
            { method: 'PUT', headers: authHeaders(config, { 'Content-Type': 'application/json' }), body: JSON.stringify(body) }
        );
        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(`Upload failed (${res.status}): ${err.message || path}`);
        }
        return await res.json();
    };

    try { return await attempt(); }
    catch (e) {
        if (e instanceof TypeError) return await attempt();
        throw e;
    }
}

function deltaPathFor(url) {
    const key = (url || '').replace(/\.html$/i, '').replace(/[^\w-]+/g, '-').replace(/^-+|-+$/g, '') || 'article';
    return `assets/deltas/${key}.json`;
}

// Override publishArticle with bulletproof version
publishArticle = async function() {
    const config = getGitHubConfig();

    if (!config.token || !config.repo) {
        showToast('❌ GitHub not configured! Redirecting to Settings...');
        setTimeout(() => window.location.href = 'settings.html', 2000);
        return;
    }
    if (!navigator.onLine) return showToast('📶 You appear offline — check your connection');

    const title = document.getElementById('titleInput').value.trim();
    const description = document.getElementById('descriptionInput').value.trim();
    const category = document.getElementById('categorySelect').value;
    const contentType = document.getElementById('contentTypeSelect').value;
    const imageUrl = document.getElementById('imageUrlInput').value;

    if (!title) return showToast('❌ Article Title is required');
    if (!description) return showToast('❌ Meta Description is required');
    if (!category) return showToast('❌ Please select a category');

    const slug = generateSlug(title);
    const today = new Date().toISOString().split('T')[0];
    const articleUrl = `tech/${slug}.html`;
    const isUpdate = editingArticleIndex !== null;

    showToast(isUpdate ? '⏳ Updating article...' : '⏳ Publishing article...');

    try {
        const articleHTML = quill ? quill.root.innerHTML : '<p>No content.</p>';
        const ogPrompt = document.getElementById('ogImagePrompt').value.trim();
        const quillDelta = quill ? quill.getContents() : { ops: [] };

        const htmlContent = generateTechArticleHTML(
            config.siteUrl, title, description,
            imageUrl || 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=800',
            contentType || 'News', category, slug, today, articleHTML, ogPrompt
        );

        const { articles } = await fetchArticlesJson(config);
        const deltaPath = deltaPathFor(articleUrl);

        const articleObject = {
            title,
            desc: description,
            image: imageUrl || 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=800',
            url: articleUrl,
            tag: contentType || 'News',
            meta: category,
            category,
            date: today,
            page: 'tech',
            delta: deltaPath
        };

        if (isUpdate && editingArticleIndex < articles.length) {
            articles[editingArticleIndex] = articleObject;

            if (editingOriginalSlug && editingOriginalSlug !== slug) {
                try {
                    const oldRes = await fetchWithRetry(
                        `https://api.github.com/repos/${config.repo}/contents/tech/${editingOriginalSlug}.html?ref=${config.branch}`,
                        { headers: authHeaders(config) }
                    );
                    if (oldRes.ok) {
                        const oldData = await oldRes.json();
                        await fetch(
                            `https://api.github.com/repos/${config.repo}/contents/tech/${editingOriginalSlug}.html`,
                            {
                                method: 'DELETE',
                                headers: authHeaders(config, { 'Content-Type': 'application/json' }),
                                body: JSON.stringify({
                                    message: `chore: rename ${editingOriginalSlug} -> ${slug}`,
                                    sha: oldData.sha,
                                    branch: config.branch
                                })
                            }
                        );
                    }
                } catch (e) { console.warn('Old file cleanup failed:', e); }
            }
        } else {
            articles.unshift(articleObject);
        }

        showToast('⏳ Uploading article file...');
        await githubPutFile(config, articleUrl, htmlContent, `feat: publish ${title}`);

        showToast('⏳ Saving editor content...');
        await githubPutFile(config, deltaPath, JSON.stringify(quillDelta), `chore: content delta for ${slug}`);

        const bloated = articles.filter(a => a && a.content && !a.delta);
        for (let i = 0; i < bloated.length; i++) {
            const a = bloated[i];
            showToast(`🧳 Optimizing database (${i + 1}/${bloated.length})...`);
            try {
                const p = deltaPathFor(a.url);
                await githubPutFile(config, p,
                    typeof a.content === 'string' ? a.content : JSON.stringify(a.content),
                    `chore: migrate content for ${a.title || p}`);
                a.delta = p;
                delete a.content;
            } catch (e) {
                console.warn('Migration step failed for', a.url, e);
            }
        }

        showToast('⏳ Updating article database...');
        await githubPutFile(config, 'assets/articles.json', JSON.stringify(articles, null, 2), 'chore: update articles.json');

        showToast(isUpdate ? '✅ Article updated successfully!' : '✅ Published to Dyve Tech!');
        editingArticleIndex = null;
        editingOriginalSlug = null;

        setTimeout(() => {
            clearForm();
            window.location.href = '../published.html';
        }, 1500);

    } catch (error) {
        console.error('Publish/Update Error:', error);
        showToast(`❌ Failed: ${error.message}`);
    }
};

// Override loadEditData with delta-aware version
loadEditData = async function() {
    const params = new URLSearchParams(window.location.search);
    if (params.get('mode') !== 'edit') return;

    const raw = localStorage.getItem('dyve-edit-article');
    if (!raw) {
        showToast('⚠️ No article data found for editing');
        history.replaceState({}, '', window.location.pathname);
        return;
    }

    try {
        const edit = JSON.parse(raw);
        editingArticleIndex = typeof edit.index === 'number' ? edit.index : null;
        editingOriginalSlug = edit.slug || null;

        document.getElementById('titleInput').value = edit.title || '';
        document.getElementById('descriptionInput').value = edit.desc || '';
        document.getElementById('imageUrlInput').value = edit.image || '';

        const catId = edit.meta || edit.category || '';
        if (catId) document.getElementById('categorySelect').value = catId;

        if (edit.tag) document.getElementById('contentTypeSelect').value = edit.tag;

        if (edit.image) {
            document.getElementById('featuredImagePreviewImg').src = edit.image;
            document.getElementById('featuredImagePreview').classList.remove('hidden');
        }

        let contentRestored = false;
        if (edit.content && quill) {
            try {
                const parsed = typeof edit.content === 'string' ? JSON.parse(edit.content) : edit.content;
                if (parsed && parsed.ops) {
                    quill.setContents(parsed);
                    contentRestored = true;
                }
            } catch (e) { console.warn('Could not parse stored Quill content:', e); }
        }

        if (!contentRestored && quill && editingArticleIndex !== null) {
            const config = getGitHubConfig();

            if (edit.delta && config.token && config.repo) {
                try {
                    const dRes = await fetchWithRetry(
                        `https://raw.githubusercontent.com/${config.repo}/${config.branch}/${edit.delta}`,
                        { headers: { 'Authorization': `token ${config.token}` } }
                    );
                    if (dRes.ok) {
                        const parsed = JSON.parse(await dRes.text());
                        if (parsed && parsed.ops) { quill.setContents(parsed); contentRestored = true; }
                    }
                } catch (e) { console.warn('Delta fetch failed:', e); }
            }

            if (!contentRestored && config.token && config.repo) {
                try {
                    const { articles } = await fetchArticlesJson(config);
                    const article = articles[editingArticleIndex];
                    if (article && article.content) {
                        const parsed = typeof article.content === 'string' ? JSON.parse(article.content) : article.content;
                        if (parsed && parsed.ops) { quill.setContents(parsed); contentRestored = true; }
                    }
                } catch (e) { console.warn('Legacy content fetch failed:', e); }
            }
        }

        document.getElementById('titleInput').dispatchEvent(new Event('input'));
        document.getElementById('descriptionInput').dispatchEvent(new Event('input'));

        localStorage.removeItem('dyve-edit-article');
        history.replaceState({}, '', window.location.pathname);

        showToast(editingArticleIndex !== null
            ? `📝 Editing: ${edit.title || 'article'}`
            : '📝 Article loaded');

    } catch (e) {
        console.error('Failed to load edit data:', e);
        showToast('❌ Failed to load article data');
        localStorage.removeItem('dyve-edit-article');
    }
};


</script>

</body>
</html>
