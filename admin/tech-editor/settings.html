<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings — Dyve Tech</title>

<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#020403">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dyve Admin">
<link rel="apple-touch-icon" href="../logo.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fffdfa; }
    </style>
</head>
<body class="min-h-screen">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-[#00001a] mb-2">Settings</h1>
            <p class="text-gray-600">Configure your Dyve Tech editor</p>
        </div>

        <div class="space-y-6">
            <!-- GitHub Configuration -->
            <div class="bg-white rounded-lg shadow border border-gray-200 p-6">
                <h2 class="text-lg font-semibold text-gray-900 mb-4 flex items-center gap-2">
                    <svg class="w-5 h-5 text-[#f15e50]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                    GitHub Configuration
                </h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">GitHub Token</label>
                        <input type="password" id="githubToken" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#f15e50] focus:border-transparent" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
                        <p class="mt-1 text-xs text-gray-500">Your GitHub Personal Access Token with repo permissions</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Repository</label>
                        <input type="text" id="githubRepo" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#f15e50] focus:border-transparent" placeholder="username/repo">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Branch</label>
                        <input type="text" id="githubBranch" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#f15e50] focus:border-transparent" placeholder="main" value="main">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Site URL</label>
                        <input type="url" id="siteUrl" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#f15e50] focus:border-transparent" placeholder="https://dyve.online" value="https://dyve.online">
                    </div>
                </div>
            </div>

            <!-- Cloudinary Configuration -->
            <div class="bg-white rounded-lg shadow border border-gray-200 p-6">
                <h2 class="text-lg font-semibold text-gray-900 mb-4 flex items-center gap-2">
                    <svg class="w-5 h-5 text-[#f15e50]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    Cloudinary Configuration
                </h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Cloud Name</label>
                        <input type="text" id="cloudName" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#f15e50] focus:border-transparent" placeholder="your-cloud-name" value="dxdbn6xwy">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Upload Preset</label>
                        <input type="text" id="uploadPreset" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#f15e50] focus:border-transparent" placeholder="your-upload-preset" value="geefox_unsigned">
                    </div>
                </div>
            </div>

            <!-- Save Button -->
            <div class="flex justify-end gap-3">
                <a href="../index.html" class="px-6 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition">Cancel</a>
                <button onclick="saveSettings()" class="px-6 py-2 bg-[#f15e50] text-white rounded-lg hover:bg-[#d94a3e] transition font-medium">Save Settings</button>
            </div>
        </div>
    </div>

    <script>
        // Load existing settings
        document.addEventListener('DOMContentLoaded', () => {
            const settings = JSON.parse(localStorage.getItem('dyve-settings') || '{}');
            if (settings.githubToken) document.getElementById('githubToken').value = settings.githubToken;
            if (settings.githubRepo) document.getElementById('githubRepo').value = settings.githubRepo;
            if (settings.githubBranch) document.getElementById('githubBranch').value = settings.githubBranch;
            if (settings.siteUrl) document.getElementById('siteUrl').value = settings.siteUrl;
        });

        function saveSettings() {
            const settings = {
                githubToken: document.getElementById('githubToken').value,
                githubRepo: document.getElementById('githubRepo').value,
                githubBranch: document.getElementById('githubBranch').value,
                siteUrl: document.getElementById('siteUrl').value,
                cloudName: document.getElementById('cloudName').value,
                uploadPreset: document.getElementById('uploadPreset').value
            };

            localStorage.setItem('dyve-settings', JSON.stringify(settings));
            
            // Show success message
            const btn = document.querySelector('button[onclick="saveSettings()"]');
            const originalText = btn.textContent;
            btn.textContent = '✓ Saved!';
            btn.classList.remove('bg-[#f15e50]');
            btn.classList.add('bg-green-600');
            
            setTimeout(() => {
                btn.textContent = originalText;
                btn.classList.add('bg-[#f15e50]');
                btn.classList.remove('bg-green-600');
                window.location.href = '../index.html';
            }, 1000);
        }
    </script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(function () {});
    });
  }
</script>

</body>
</html>
