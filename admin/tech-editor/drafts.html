<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Drafts — Dyve Tech</title>

    <link rel="manifest" href="../manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#f15e50">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dyve: { bg: '#fffdfa', accent: '#f15e50', accentHover: '#d94a3e', text: '#00001a', muted: '#5d5f79' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fffdfa; overflow-x: hidden; }
        .draft-card { transition: all 0.2s ease; }
        @media (hover: hover) {
            .draft-card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="bg-white/95 backdrop-blur-md border-b border-gray-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex items-center justify-between gap-3">
                <div class="flex items-center gap-3 flex-1 min-w-0">
                    <button onclick="window.history.length > 1 ? window.history.back() : window.location.href='index.html'" 
                            class="p-2 rounded-lg hover:bg-gray-100 transition text-gray-600 flex-shrink-0" title="Go Back">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    </button>
                    <div class="flex items-center gap-2 min-w-0">
                        <svg width="24" height="24" viewBox="0 0 32 32" fill="none" class="text-[#f15e50] flex-shrink-0">
                            <path d="M16 32C24.8366 32 32 24.8366 32 16C32 7.16344 24.8366 0 16 0C7.16344 0 0 7.16344 0 16C0 24.8366 7.16344 32 16 32Z" fill="currentColor"></path>
                        </svg>
                        <h1 class="text-lg sm:text-xl font-bold text-[#00001a] truncate">Saved Drafts</h1>
                    </div>
                </div>
                <a href="index.html" class="flex items-center gap-2 px-3 sm:px-4 py-2 bg-[#f15e50] text-white text-sm font-semibold rounded-lg hover:bg-[#d94a3e] transition shadow-sm flex-shrink-0">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    <span class="hidden sm:inline">New Draft</span>
                </a>
            </div>
        </div>
    </header>

    <!-- GITHUB STATUS -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-4">
        <div id="githubStatus" class="flex items-center gap-2 px-3 py-2 bg-white border border-gray-200 rounded-lg w-fit shadow-sm">
            <svg class="w-4 h-4 text-gray-400 flex-shrink-0" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
            </svg>
            <div id="statusDot" class="w-2 h-2 rounded-full bg-yellow-500 flex-shrink-0"></div>
            <span id="statusText" class="text-xs font-medium text-gray-600 truncate">Checking GitHub...</span>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full">
        <div id="draftsContainer" class="space-y-3">
            <!-- Drafts will be injected here -->
        </div>
        
        <!-- Empty State -->
        <div id="emptyState" class="hidden flex flex-col items-center justify-center py-16 sm:py-20 text-center px-4">
            <div class="w-16 h-16 sm:w-20 sm:h-20 bg-gray-100 rounded-full flex items-center justify-center mb-4">
                <svg class="w-8 h-8 sm:w-10 sm:h-10 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                </svg>
            </div>
            <h3 class="text-base sm:text-lg font-semibold text-gray-900 mb-1">No saved drafts</h3>
            <p class="text-sm text-gray-500 mb-6 max-w-sm">Start writing your next tech article and save it as a draft to continue later.</p>
            <a href="index.html" class="px-6 py-2.5 bg-[#f15e50] text-white font-medium rounded-lg hover:bg-[#d94a3e] transition text-sm">Create New Draft</a>
        </div>
    </main>

    <!-- TOAST -->
    <div id="toast" class="fixed bottom-4 sm:bottom-6 left-4 sm:left-auto right-4 sm:right-6 bg-[#00001a] text-white border border-[#f15e50]/30 px-6 py-3 rounded-lg shadow-2xl hidden z-50 flex items-center gap-2 transition-all duration-300">
        <span id="toastMessage"></span>
    </div>

    <script>
        // ==========================================
        // CORE FUNCTIONS
        // ==========================================
        function getGitHubConfig() {
            try {
                return JSON.parse(localStorage.getItem('dyve-settings') || '{}');
            } catch (e) {
                console.error('Failed to parse settings:', e);
                return {};
            }
        }

        function showToast(message, duration = 3000) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toastMessage');
            if (!msgEl) return;
            msgEl.textContent = message;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), duration);
        }

        function formatDate(timestamp) {
            if (!timestamp) return 'Unknown date';
            const date = new Date(timestamp);
            if (isNaN(date.getTime())) return 'Unknown date';
            return date.toLocaleDateString('en-US', { 
                month: 'short', 
                day: 'numeric', 
                year: 'numeric', 
                hour: '2-digit', 
                minute: '2-digit' 
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ==========================================
        // GITHUB STATUS CHECK
        // ==========================================
        async function checkGitHubConnection() {
            const config = getGitHubConfig();
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            
            if (!config.githubToken || !config.githubRepo) {
                statusDot.className = 'w-2 h-2 rounded-full bg-red-500 flex-shrink-0';
                statusText.textContent = 'Not configured (Check Settings)';
                return;
            }
            
            try {
                const response = await fetch(`https://api.github.com/repos/${config.githubRepo}`, {
                    headers: { 'Authorization': `token ${config.githubToken}` }
                });
                if (response.ok) {
                    statusDot.className = 'w-2 h-2 rounded-full bg-green-500 flex-shrink-0';
                    statusText.textContent = 'Connected to GitHub';
                } else {
                    statusDot.className = 'w-2 h-2 rounded-full bg-red-500 flex-shrink-0';
                    statusText.textContent = 'Connection failed';
                }
            } catch (e) {
                statusDot.className = 'w-2 h-2 rounded-full bg-red-500 flex-shrink-0';
                statusText.textContent = 'Offline';
            }
        }

        // ==========================================
        // DRAFT MANAGEMENT
        // ==========================================
        function loadDrafts() {
            let drafts = [];
            try {
                drafts = JSON.parse(localStorage.getItem('dyve-tech-drafts') || '[]');
                if (!Array.isArray(drafts)) drafts = [];
            } catch (e) {
                console.error('Failed to parse drafts:', e);
                drafts = [];
            }

            const container = document.getElementById('draftsContainer');
            const emptyState = document.getElementById('emptyState');
            
            if (!container || !emptyState) {
                console.error('Required elements not found');
                return;
            }
            
            container.innerHTML = '';
            
            if (drafts.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            
            emptyState.classList.add('hidden');
            
            // Sort by newest first
            drafts.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
            
            drafts.forEach(draft => {
                if (!draft || typeof draft !== 'object') return;
                
                const card = document.createElement('div');
                card.className = 'draft-card bg-white rounded-xl border border-gray-200 p-4 sm:p-5';
                
                const categoryBadge = draft.category ? 
                    `<span class="inline-block px-2 py-0.5 bg-[#f15e50]/10 text-[#f15e50] text-xs font-semibold rounded-full mb-2">${escapeHtml(draft.category)}</span>` : '';
                
                const description = draft.description ? escapeHtml(draft.description) : 'No description provided.';
                const title = draft.title ? escapeHtml(draft.title) : 'Untitled Draft';
                const hasImage = !!draft.imageUrl;
                
                card.innerHTML = `
                    <div class="mb-4">
                        ${categoryBadge}
                        <h3 class="text-base sm:text-lg font-bold text-gray-900 mb-1 line-clamp-2">${title}</h3>
                        <p class="text-sm text-gray-500 line-clamp-2 mb-3">${description}</p>
                        <div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-xs text-gray-400">
                            <span class="flex-shrink-0">Last edited: ${formatDate(draft.updatedAt)}</span>
                            ${hasImage ? '<span class="flex items-center gap-1 flex-shrink-0"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg> Image attached</span>' : ''}
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="editDraft('${draft.id}')" class="flex-1 px-4 py-2.5 bg-[#f15e50] text-white text-sm font-medium rounded-lg hover:bg-[#d94a3e] transition flex items-center justify-center gap-2">
                            <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                            <span>Edit</span>
                        </button>
                        <button onclick="deleteDraft('${draft.id}')" class="px-4 py-2.5 border border-gray-200 text-gray-600 text-sm font-medium rounded-lg hover:bg-red-50 hover:text-red-600 hover:border-red-200 transition flex items-center justify-center gap-2">
                            <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function editDraft(id) {
            if (!id) {
                showToast('❌ Invalid draft ID');
                return;
            }
            window.location.href = `index.html?edit=${encodeURIComponent(id)}`;
        }

        function deleteDraft(id) {
            if (!id) {
                showToast('❌ Invalid draft ID');
                return;
            }
            
            if (!confirm('Are you sure you want to permanently delete this draft? This action cannot be undone.')) {
                return;
            }
            
            try {
                let drafts = JSON.parse(localStorage.getItem('dyve-tech-drafts') || '[]');
                if (!Array.isArray(drafts)) {
                    showToast('❌ Drafts storage corrupted');
                    return;
                }
                
                drafts = drafts.filter(d => d && d.id !== id);
                localStorage.setItem('dyve-tech-drafts', JSON.stringify(drafts));
                
                showToast('✅ Draft deleted');
                loadDrafts();
            } catch (e) {
                console.error('Delete failed:', e);
                showToast('❌ Failed to delete draft');
            }
        }

        // ==========================================
        // INITIALIZATION
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            checkGitHubConnection();
            loadDrafts();
        });

        // Handle storage errors gracefully
        window.addEventListener('storage', (e) => {
            if (e.key === 'dyve-tech-drafts') {
                loadDrafts();
            }
        });
    </script>
</body>
</html>
