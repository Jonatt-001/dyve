<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Published — Dyve HackaX</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-50 text-slate-900"><header class="fixed top-0 left-0 right-0 bg-white/95 backdrop-blur border-b border-slate-200 z-50"><div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between"><div><div class="text-[10px] uppercase tracking-[.18em] text-slate-500 font-bold">DYVE|HACKAX</div><div class="font-bold">Published Cybersecurity Articles</div></div><a href="index.html" class="px-4 py-2 bg-[#4F8A73] text-white rounded-lg text-xs font-bold">New Article</a></div></header><main class="max-w-6xl mx-auto px-4 pt-28 pb-16"><div id="list" class="grid md:grid-cols-2 gap-4"></div></main>
<script>
const a=JSON.parse(localStorage.getItem('dyve-cyber-drafts')||'[]').filter(x=>x.status==='published');const l=document.getElementById('list');const e=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(!a.length)l.innerHTML='<div class="col-span-full bg-white border border-slate-200 rounded-xl p-10 text-center text-slate-500">No local published records. GitHub remains the canonical publication source.</div>';
else l.innerHTML=a.map((x,i)=>`<article class="bg-white border border-slate-200 rounded-xl overflow-hidden"><div class="h-40 bg-slate-100">${x.imageUrl?`<img src="${e(x.imageUrl)}" class="w-full h-full object-cover" alt="">`:''}</div><div class="p-5"><div class="text-[10px] uppercase tracking-wider text-[#4F8A73] font-bold">${e(x.category)}</div><h2 class="mt-2 font-bold">${e(x.title)}</h2><p class="mt-2 text-xs text-slate-500">${e(x.description)}</p><button onclick="edit(${i})" class="mt-4 px-3 py-2 text-xs font-bold border rounded-lg">Edit</button></div></article>`).join('');
function edit(i){localStorage.setItem('dyve-cyber-edit-article',JSON.stringify(a[i]));location.href='index.html?mode=edit'}
</script></body></html>
