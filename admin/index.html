    <script>
        // ============================================
        // STATE
        // ============================================
        let quill = null;
        let existingArticles = [];

        // ============================================
        // HELPER FUNCTIONS
        // ============================================
        async function imageHandler() {
            const input = document.createElement('input');
            input.setAttribute('type', 'file');
            input.setAttribute('accept', 'image/*');
            input.setAttribute('multiple', 'true');
            input.click();

            input.onchange = async () => {
                const files = input.files;
                if (files && files.length > 0) {
                    showToast('📤 Uploading images...');
                    const range = quill.getSelection(true);
                    
                    for (let i = 0; i < files.length; i++) {
                        const file = files[i];
                        const compressedFile = await compressImage(file, 1200, 0.85);
                        const result = await uploadToCloudinary(compressedFile);
                        
                        if (result) {
                            quill.insertEmbed(range.index, 'image', result.url, {
                                alt: result.alt,
                                width: Math.min(result.width, 800),
                                loading: 'lazy'
                            });
                            range.index += 1;
                        }
                    }
                    showToast('✅ Images uploaded & optimized!');
                }
            };
        }

        function simpleHtmlToDelta(html) {
            const ops = [];
            html = html.replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '');
            html = html.replace(/<style\b[^<]*(?:(?!<\/style>)<[^<]*)*<\/style>/gi, '');
            const blocks = html.split(/<\/p>|<\/h[1-6]>|<\/li>|<\/blockquote>|<br\s*\/?>/i);
            
            blocks.forEach(block => {
                block = block.trim();
                if (!block) return;
                const text = block.replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').trim();
                if (!text && !/<img/i.test(block)) return;
                
                let attributes = {};
                if (/<h1/i.test(block)) attributes.header = 1;
                else if (/<h2/i.test(block)) attributes.header = 2;
                else if (/<h3/i.test(block)) attributes.header = 3;
                else if (/<blockquote/i.test(block)) attributes.blockquote = true;
                else if (/<li/i.test(block)) attributes.list = 'bullet';
                
                if (text) {
                    ops.push({ insert: text + '\n', attributes: Object.keys(attributes).length > 0 ? attributes : undefined });
                } else {
                    ops.push({ insert: '\n' });
                }
            });
            
            return ops.length > 0 ? { ops } : { ops: [{ insert: '\n' }] };
        }

        // ============================================
        // CLOUDINARY CONFIGURATION
        // ============================================
        const CLOUDINARY_CONFIG = {
            cloudName: 'dxdbn6xwy',
            uploadPreset: 'geefox_unsigned',
            endpoint: 'https://api.cloudinary.com/v1_1/dxdbn6xwy/image/upload'
        };

        function generateAltText(filename, context = '') {
            const name = filename.replace(/\.[^/.]+$/, '').replace(/[-_]/g, ' ');
            const words = name.split(' ').filter(w => w.length > 3);
            const keywords = words.slice(0, 3).join(' ');
            return `${keywords} - Dyve HackaX Intelligence Report`;
        }

        async function compressImage(file, maxWidth = 1920, quality = 0.8) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        canvas.toBlob((blob) => {
                            resolve(new File([blob], file.name, { type: 'image/jpeg', lastModified: Date.now() }));
                        }, 'image/jpeg', quality);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

                async function uploadToCloudinary(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CLOUDINARY_CONFIG.uploadPreset);
            formData.append('tags', 'dyve-hackax,intelligence');
            
            try {
                const response = await fetch(CLOUDINARY_CONFIG.endpoint, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.secure_url) {
                    // Use the direct URL provided by Cloudinary instead of building a custom one
                    return {
                        url: data.secure_url,
                        alt: generateAltText(data.original_filename, ''),
                        width: data.width,
                        height: data.height
                    };
                }
                throw new Error('Upload failed');
            } catch (error) {
                console.error('Cloudinary upload error:', error);
                showToast('❌ Image upload failed');
                return null;
            }
        }


        async function handleFeaturedImageUpload(event) {
            const files = event.target.files;
            if (files.length === 0) return;
            
            showToast('📤 Uploading and compressing image...');
            const file = files[0];
            const compressedFile = await compressImage(file);
            const result = await uploadToCloudinary(compressedFile);
            
            if (result) {
                const imgInput = document.getElementById('imageUrlInput');
                if (imgInput) imgInput.value = result.url;
                
                document.getElementById('featuredImagePreviewImg').src = result.url;
                document.getElementById('featuredImageAlt').textContent = `Alt: ${result.alt}`;
                document.getElementById('featuredImagePreview').classList.remove('hidden');
                showToast('✅ Featured image uploaded & optimized!');
            }
        }

        function generateSlug(title) {
            return title.toLowerCase().replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-').trim();
        }

        function showToast(message, duration = 4000) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), duration);
        }

        function setupStickyMenu() {
            const menuToggle = document.getElementById('menuToggle');
            const slideMenu = document.getElementById('slideMenu');
            const menuIcon = document.getElementById('menuIcon');
            let menuOpen = false;

            menuToggle.addEventListener('click', () => {
                menuOpen = !menuOpen;
                if (menuOpen) {
                    slideMenu.classList.remove('translate-y-4', 'opacity-0', 'pointer-events-none');
                    slideMenu.classList.add('translate-y-0', 'opacity-100', 'pointer-events-auto');
                    menuIcon.style.transform = 'rotate(90deg)';
                } else {
                    slideMenu.classList.add('translate-y-4', 'opacity-0', 'pointer-events-none');
                    slideMenu.classList.remove('translate-y-0', 'opacity-100', 'pointer-events-auto');
                    menuIcon.style.transform = 'rotate(0deg)';
                }
            });

            document.addEventListener('click', (e) => {
                if (!document.getElementById('stickyMenu').contains(e.target) && menuOpen) {
                    menuToggle.click();
                }
            });
        }

        // ============================================
        // SEO ANALYSIS
        // ============================================
        function analyzeSEO() {
            const title = document.getElementById('titleInput').value;
            const description = document.getElementById('descriptionInput').value;
            const content = quill ? quill.getText() : '';
            const analysis = [];
            
            if (!title) analysis.push({ type: 'error', message: '❌ Title is required' });
            else if (title.length < 30) analysis.push({ type: 'warning', message: '⚠️ Title is too short (aim for 50-60 characters)' });
            else if (title.length > 70) analysis.push({ type: 'warning', message: '⚠️ Title is too long (may be truncated)' });
            else analysis.push({ type: 'success', message: '✅ Title length is optimal' });

            if (!description) analysis.push({ type: 'error', message: '❌ Meta description is required' });
            else if (description.length < 120) analysis.push({ type: 'warning', message: '⚠️ Description is too short (aim for 150-160 characters)' });
            else if (description.length > 160) analysis.push({ type: 'warning', message: '⚠️ Description is too long (will be truncated)' });
            else analysis.push({ type: 'success', message: '✅ Description length is optimal' });

            const wordCount = content.split(/\s+/).filter(w => w).length;
            if (wordCount < 300) analysis.push({ type: 'warning', message: '⚠️ Content is too short (aim for 500+ words)' });
            else analysis.push({ type: 'success', message: `✅ Content length is good (${wordCount} words)` });

            const container = document.getElementById('seoAnalysis');
            container.innerHTML = analysis.map(item => {
                const colors = { error: 'bg-red-50 text-red-800 border-red-200', warning: 'bg-yellow-50 text-yellow-800 border-yellow-200', success: 'bg-green-50 text-green-800 border-green-200' };
                return `<div class="p-3 rounded-lg border ${colors[item.type]} text-sm">${item.message}</div>`;
            }).join('');
        }

                function suggestInternalLinks() {
            const content = quill ? quill.getText().toLowerCase() : '';
            const title = document.getElementById('titleInput').value.toLowerCase();
            const combinedText = title + ' ' + content;
            
            // Extract substantial words for matching (5 chars or more)
            const currentKeywords = [...new Set(combinedText.match(/\b[a-z]{5,}\b/g) || [])];

            const suggestions = existingArticles
                .map(article => {
                    let score = 0;
                    const targetText = `${article.title} ${article.category} ${article.tag}`.toLowerCase();

                    // Boost score if the current text explicitly mentions the target's tag
                    if (article.tag && content.includes(article.tag.toLowerCase())) score += 2;

                    // Match keywords between current text and target metadata
                    currentKeywords.forEach(kw => {
                        if (targetText.includes(kw)) score += 1;
                    });

                    // Prevent suggesting the article currently being edited
                    if (window.isEditMode && article.url.includes(window.editArticleSlug)) {
                        score = -1;
                    }

                    return { ...article, score };
                })
                .filter(item => item.score > 0)
                .sort((a, b) => b.score - a.score)
                .slice(0, 5);

            const container = document.getElementById('linkSuggestions');
            if (suggestions.length === 0) {
                container.innerHTML = '<div class="text-sm text-gray-500">No relevant articles found for linking</div>';
                return;
            }

            // Render UI with exact title and pass data to insertLink
                        // Update this line inside suggestInternalLinks()
            container.innerHTML = suggestions.map(item => `
                <div class="suggestion-item p-3 border border-gray-200 rounded-lg bg-gray-50 mb-2">
                    <div class="text-sm font-bold text-gray-900">${item.title}</div>
                    <div class="text-xs text-dyve-accent font-medium mt-1 uppercase">${item.tag || ''}</div>
                    
                    <!-- Pass the url, title, and tag to the smart insert function -->
                    <button onclick="insertLink('${item.url}', '${item.title.replace(/'/g, "\\'")}', '${(item.tag || '').replace(/'/g, "\\'")}')" class="mt-3 text-xs text-dyve-bg bg-dyve-accent px-3 py-1.5 rounded font-bold hover:bg-dyve-accentHover transition w-full">
                        Insert Smart Link
                    </button>
                    
                </div>
            `).join('');

        }


                function insertLink(url, articleTitle, articleTag = '') {
            if (!quill) return;

            const finalUrl = url.startsWith('/') ? url : `/${url}`;
            const range = quill.getSelection(true); 
            const editorText = quill.getText().toLowerCase();

            // 1. MANUAL OVERRIDE: If you explicitly highlighted text, respect that first.
            if (range && range.length > 0) {
                quill.formatText(range.index, range.length, 'link', finalUrl);
                quill.setSelection(range.index + range.length);
                showToast('✅ Link applied to selected text!');
                return;
            }

            // 2. SMART AUTO-LINKING: Search existing text for relevant phrases
            // Clean the title to remove parentheticals (e.g., "Dark Web (Marketplaces)" -> "dark web")
            const cleanTitle = articleTitle.toLowerCase().replace(/\(.*?\)/g, '').trim();
            const words = cleanTitle.split(/\s+/).filter(w => w.length > 4); // Get substantial words
            
            // Build an array of phrases to search for, from longest/most specific to shortest
            let searchPhrases = [
                cleanTitle, 
                articleTag.toLowerCase(),
                ...words.map((w, i, arr) => arr.slice(i, i+3).join(' ')), // 3-word combos
                ...words.map((w, i, arr) => arr.slice(i, i+2).join(' ')), // 2-word combos
                ...words.filter(w => w.length > 6) // Single long words (e.g., "infrastructure")
            ].filter(p => p && p.trim().length > 4); 

            let matchIndex = -1;
            let matchLength = 0;

            // Scan the editor text for the first available un-linked phrase
            for (let phrase of searchPhrases) {
                let idx = editorText.indexOf(phrase);
                if (idx !== -1) {
                    // Verify this text isn't already part of an existing link
                    const format = quill.getFormat(idx, phrase.length);
                    if (!format.link) {
                        matchIndex = idx;
                        matchLength = phrase.length;
                        break; // Stop at the longest, best match
                    }
                }
            }

            if (matchIndex !== -1) {
                // Found a matching phrase! Format it as a link.
                quill.formatText(matchIndex, matchLength, 'link', finalUrl);
                
                // Select/highlight the newly linked text so you can instantly see what changed
                quill.setSelection(matchIndex, matchLength);
                showToast('✨ Auto-linked matching phrase in text!');
            } else {
                // 3. FALLBACK: No matching text found. Insert at cursor.
                const insertIdx = range ? range.index : quill.getLength();
                quill.insertText(insertIdx, articleTitle, 'link', finalUrl);
                quill.setSelection(insertIdx + articleTitle.length);
                quill.format('link', false);
                quill.insertText(insertIdx + articleTitle.length, ' ');
                showToast('✅ Link inserted at cursor!');
            }
        }

        // ============================================
        // CONVERT QUILL TO HTML
        // ============================================
        function convertQuillToHTML(delta) {
            if (!delta.ops) return '';
            let html = '';
            delta.ops.forEach(op => {
                let text = op.insert || '';
                if (typeof text !== 'string') return;
                if (text === '\n') { html += '</p><p>'; return; }
                if (op.attributes) {
                    if (op.attributes.bold) text = `<strong>${text}</strong>`;
                    if (op.attributes.italic) text = `<em>${text}</em>`;
                    if (op.attributes.underline) text = `<u>${text}</u>`;
                    if (op.attributes.strike) text = `<s>${text}</s>`;
                    if (op.attributes.header === 1) text = `<h2>${text}</h2>`;
                    if (op.attributes.header === 2) text = `<h3>${text}</h3>`;
                    if (op.attributes.list === 'ordered') text = `<li>${text}</li>`;
                    if (op.attributes.list === 'bullet') text = `<li>${text}</li>`;
                    if (op.attributes.blockquote) text = `<blockquote>${text}</blockquote>`;
                    if (op.attributes.code) text = `<code>${text}</code>`;
                }
                html += text;
            });
            html = html.replace(/<p><\/p>/g, '');
            html = '<p>' + html + '</p>';
            html = html.replace(/<p>(<h[23][^>]*>)/g, '$1');
            html = html.replace(/(<\/h[23]>)<\/p>/g, '$1');
            html = html.replace(/<p>(<li>)/g, '<ul>$1');
            html = html.replace(/(<\/li>)<\/p>/g, '$1</ul>');
            html = html.replace(/<\/ul><ul>/g, '');
            return html || '<p>No content available.</p>';
        }

        async function publishArticle() {
            const config = getGitHubConfig();
            
            if (!config.token || !config.repo) {
                showToast('❌ GitHub not configured! Go to Settings first.');
                return;
            }

            const title = document.getElementById('titleInput').value.trim();
            const description = document.getElementById('descriptionInput').value.trim();
            const category = document.getElementById('categorySelect').value.trim();
            const intelTag = document.getElementById('intelTagInput').value.trim() || 'INTEL';
            const metaStatus = document.getElementById('metaStatusInput').value.trim() || 'Active Threat';
            
            const imgInput = document.getElementById('imageUrlInput');
            const imageUrl = (imgInput ? imgInput.value.trim() : '') || 'https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=800';
            
            if (!title || !description) {
                showToast('❌ Title and Description are required');
                return;
            }

            const slug = window.isEditMode ? window.editArticleSlug : generateSlug(title);
            const publishBtn = document.getElementById('publishBtn');
            publishBtn.classList.add('loading');
            publishBtn.textContent = window.isEditMode ? 'Updating...' : 'Publishing...';

                        try {
                const today = new Date().toISOString().split('T')[0];
                
                // Route to category subfolder for organized structure
                const isNested = (category === 'dark-web' || category === 'ransomware');
                const articleUrl = isNested ? `article/${category}/${slug}.html` : `article/${slug}.html`;

                const editorContent = quill ? quill.getContents() : { ops: [] }; // Keep for articles.json state

const editorHTML = quill ? quill.root.innerHTML : ''; // Grab native HTML for the static page

// Pass editorHTML instead of editorContent to the generator
const htmlContent = generateArticleHTML(config.siteUrl, title, description, imageUrl, intelTag, metaStatus, category, slug, today, editorHTML);

                const htmlBase64 = btoa(unescape(encodeURIComponent(htmlContent)));

                const fetchRes = await fetch(`https://api.github.com/repos/${config.repo}/contents/assets/articles.json?ref=${config.branch}`, {
                    headers: { 'Authorization': `token ${config.token}` }
                });
                
                let articles = [];
                let jsonSha = '';
                
                if (fetchRes.ok) {
                    const jsonData = await fetchRes.json();
                    jsonSha = jsonData.sha;
                    const decodedContent = atob(jsonData.content);
                    articles = JSON.parse(decodedContent);
                }

                const newArticle = {
                    title: title,
                    desc: description,
                    image: imageUrl,
                    url: articleUrl,
                    tag: intelTag.toUpperCase(),
                    meta: metaStatus,
                    category: category,
                    date: today,
                    content: JSON.stringify(editorContent)
                };

                if (window.isEditMode && window.editArticleIndex !== undefined) {
                    articles[window.editArticleIndex] = newArticle;
                } else {
                    articles.unshift(newArticle);
                }

                const newJsonContent = JSON.stringify(articles, null, 2);
                const jsonBase64 = btoa(unescape(encodeURIComponent(newJsonContent)));

                await fetch(`https://api.github.com/repos/${config.repo}/contents/${articleUrl}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${config.token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: `${window.isEditMode ? 'update' : 'feat'}: ${title}`, content: htmlBase64, branch: config.branch })
                });

                await fetch(`https://api.github.com/repos/${config.repo}/contents/assets/articles.json`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${config.token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: `${window.isEditMode ? 'update' : 'chore'}: articles.json`, content: jsonBase64, sha: jsonSha, branch: config.branch })
                });

                if (window.isEditMode) {
                    localStorage.removeItem('dyve-edit-article');
                    window.isEditMode = false;
                    window.editArticleIndex = undefined;
                    window.editArticleSlug = undefined;
                    
                    publishBtn.textContent = 'Update Intel';
                    publishBtn.classList.remove('bg-yellow-500', 'hover:bg-yellow-600');
                    publishBtn.classList.add('bg-dyve-accent', 'hover:bg-dyve-accentHover');
                    
                    showToast('✅ Article updated successfully! Redirecting...');
                    setTimeout(() => { window.location.href = 'published.html'; }, 1500);
                } else {
                    showToast('✅ Intel Published & Feed Updated!');
                    clearForm();
                    await loadExistingArticles();
                }

            } catch (error) {
                console.error('Publish error:', error);
                showToast('❌ Error: ' + error.message);
            } finally {
                publishBtn.classList.remove('loading');
                publishBtn.textContent = window.isEditMode ? 'Update Intel' : 'Publish Intel';
            }
        }

        async function checkGitHubConnection() {
            const config = getGitHubConfig();
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const refreshIcon = document.getElementById('refreshIcon');
            
            refreshIcon.classList.add('animate-spin');
            statusText.textContent = 'Checking...';
            statusDot.className = 'w-2 h-2 rounded-full bg-yellow-500';
            
            if (!config.token || !config.repo) {
                statusDot.className = 'w-2 h-2 rounded-full bg-red-500';
                statusText.textContent = 'Not Configured';
                refreshIcon.classList.remove('animate-spin');
                return false;
            }
            
            try {
                const response = await fetch(`https://api.github.com/repos/${config.repo}`, {
                    headers: { 'Authorization': `token ${config.token}` }
                });
                
                if (response.ok) {
                    statusDot.className = 'w-2 h-2 rounded-full bg-green-500';
                    statusText.textContent = 'Connected';
                    refreshIcon.classList.remove('animate-spin');
                    return true;
                } else {
                    statusDot.className = 'w-2 h-2 rounded-full bg-red-500';
                    statusText.textContent = 'Connection Failed';
                    refreshIcon.classList.remove('animate-spin');
                    return false;
                }
            } catch (error) {
                statusDot.className = 'w-2 h-2 rounded-full bg-red-500';
                statusText.textContent = 'Offline';
                refreshIcon.classList.remove('animate-spin');
                return false;
            }
        }

        // ============================================
        // INITIALIZATION
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            quill = new Quill('#editor', {
                theme: 'snow',
                placeholder: 'Begin intelligence report...',
                modules: {
                    toolbar: {
                        container: [
                            [{ 'header': [1, 2, 3, false] }],
                            ['bold', 'italic', 'underline', 'strike'],
                            [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                            ['blockquote', 'code-block'],
                            ['link', 'image'],
                            ['clean']
                        ],
                        handlers: {
                            image: imageHandler
                        }
                    }
                }
            });

            const urlParams = new URLSearchParams(window.location.search);
            const mode = urlParams.get('mode');
            
            if (mode === 'edit') {
                const editData = JSON.parse(localStorage.getItem('dyve-edit-article') || '{}');
                
                if (editData && editData.title) {
                    document.getElementById('titleInput').value = editData.title || '';
                    document.getElementById('descriptionInput').value = editData.desc || '';
                    document.getElementById('categorySelect').value = editData.category || 'breach';
                    document.getElementById('intelTagInput').value = editData.tag || '';
                    document.getElementById('metaStatusInput').value = editData.meta || '';
                    
                    const imgInput = document.getElementById('imageUrlInput');
                    if (imgInput) imgInput.value = editData.image || '';
                    
                    const publishBtn = document.getElementById('publishBtn');
                    publishBtn.textContent = 'Update Intel';
                    publishBtn.classList.remove('bg-dyve-accent', 'hover:bg-dyve-accentHover');
                    publishBtn.classList.add('bg-yellow-500', 'hover:bg-yellow-600');
                    
                    window.isEditMode = true;
                    window.editArticleIndex = editData.index;
                    window.editArticleSlug = editData.slug;
                    
                    if (editData.content) {
                        try {
                            quill.setContents(JSON.parse(editData.content));
                            showToast('📝 Editing article - loaded from local draft');
                        } catch(e) {
                            console.error("Failed to parse edit content", e);
                        }
                                        } else {
                        const config = getGitHubConfig();
                        // Use the full URL from the article data to support nested categories
                        const fetchPath = editData.url || `article/${editData.slug}.html`;
                        fetch(`https://api.github.com/repos/${config.repo}/contents/${fetchPath}?ref=${config.branch}`, {
                            headers: { 'Authorization': `token ${config.token}` }
                        })

                                               .then(res => res.json())
                        .then(data => {
                            if (data.content) {
                                // FIX: Added UTF-8 decoding to prevent mojibake (ÃÂ characters)
                                const htmlContent = decodeURIComponent(escape(atob(data.content)));
                                const bodyMatch = htmlContent.match(/<div class="content"[^>]*>([\s\S]*?)<\/div>\s*<\/main>/);
                                if (bodyMatch && bodyMatch[1]) {
                                    const delta = simpleHtmlToDelta(bodyMatch[1].trim());
                                    quill.setContents(delta);
                                    showToast('✅ Article content loaded from GitHub');
                                }
                            }
                        })

                        .catch(error => {
                            console.error('Error loading article content:', error);
                        });
                    }
                }
            }

            document.getElementById('titleInput').addEventListener('input', (e) => {
                document.getElementById('slugPreview').textContent = generateSlug(e.target.value) || 'your-intel-slug';
            });

            document.getElementById('descriptionInput').addEventListener('input', (e) => {
                document.getElementById('descCharCount').textContent = e.target.value.length;
            });

            document.getElementById('featuredImageInput').addEventListener('change', handleFeaturedImageUpload);
            document.getElementById('analyzeSeoBtn').addEventListener('click', analyzeSEO);
            document.getElementById('suggestLinksBtn').addEventListener('click', suggestInternalLinks);
            document.getElementById('saveDraftBtn').addEventListener('click', saveDraft);
            document.getElementById('publishBtn').addEventListener('click', publishArticle);

            loadExistingArticles();
            setupStickyMenu();
            checkGitHubConnection();
            
            document.getElementById('refreshStatusBtn').addEventListener('click', () => {
                checkGitHubConnection();
            });

            const savedDraft = localStorage.getItem('dyve-draft');
            if (savedDraft) {
                try {
                    const draft = JSON.parse(savedDraft);
                    document.getElementById('titleInput').value = draft.title || '';
                    document.getElementById('descriptionInput').value = draft.description || '';
                    document.getElementById('categorySelect').value = draft.category || 'breach';
                    document.getElementById('intelTagInput').value = draft.intelTag || '';
                    document.getElementById('metaStatusInput').value = draft.metaStatus || '';
                    const imgInput = document.getElementById('imageUrlInput');
                    if (imgInput) imgInput.value = draft.imageUrl || '';
                    
                    if (draft.content && quill) {
                        quill.setContents(draft.content);
                    }
                    
                    document.getElementById('titleInput').dispatchEvent(new Event('input'));
                    document.getElementById('descriptionInput').dispatchEvent(new Event('input'));
                    
                    localStorage.removeItem('dyve-draft');
                    localStorage.removeItem('dyve-draft-index');
                    showToast('📝 Draft loaded successfully');
                } catch (e) {
                    console.error('Failed to load draft', e);
                }
            }
        });
    </script>

        navigator.serviceWorker.register('/admin/sw.js')
          .then(registration => {
            console.log('[SW] Registered:', registration.scope);
          })
          .catch(error => {
            console.error('[SW] Registration failed:', error);
          });
      });
    }
    </script>
