name: Dyve SEO Authority Engine

on:
  push:
    branches: [main]
    paths:
      # ============================================================
      # DATABASES
      # ============================================================

      # Dyve HackaX
      - 'assets/articles.json'

      # Dyve Tech
      - 'assets/tech-articles.json'

      # ============================================================
      # DYVE TECH
      # Technology News & Intelligence
      # ============================================================

      - 'tech/**'

      # ============================================================
      # DYVE HACKAX
      # Cybersecurity Intelligence
      # ============================================================

      - 'cybersecurity/**'
      - 'threat-intelligence/**'
      - 'breaches/**'
      - 'dark-web/**'
      - 'ransomware/**'
      - 'threat-actors/**'
      - 'vulnerabilities/**'
      - 'malware/**'
      - 'ai-security/**'
      - 'cloud-security/**'
      - 'signals/**'
      - 'analysis/**'

  workflow_dispatch:

concurrency:
  group: dyve-seo-authority-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  seo-authority:
    name: Validate Canonicals & Rebuild SEO Assets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # ============================================================
      # NODE
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ============================================================
      # VALIDATE BOTH EDITOR DATABASES
      # ============================================================

      - name: Validate Dyve Tech & HackaX databases and generate sitemap
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          /*
           * ============================================================
           * CANONICAL HOST
           * ============================================================
           *
           * Vercel production configuration:
           *
           * https://dyve.online
           *        ↓ 308
           * https://www.dyve.online
           *
           * Therefore www.dyve.online is the single authoritative
           * canonical host for all public SEO URLs.
           */

          const SITE_URL = 'https://www.dyve.online';
          const SITE_HOST = 'www.dyve.online';

          /*
           * The non-www hostname is intentionally treated as a
           * redirect-only hostname.
           */

          const REDIRECT_HOST = 'dyve.online';

          /*
           * ============================================================
           * DATABASES
           * ============================================================
           *
           * Dyve Tech:
           * assets/tech-articles.json
           *
           * Dyve HackaX:
           * assets/articles.json
           */

          const DATABASES = {
            tech: {
              name: 'Dyve Tech',
              description: 'Technology News & Intelligence',
              file: 'assets/tech-articles.json',

              sections: {
                tech: {
                  index: '/tech/',
                  priority: '0.9'
                }
              }
            },

            hackax: {
              name: 'Dyve HackaX',
              description: 'Cybersecurity Intelligence',
              file: 'assets/articles.json',

              sections: {
                cybersecurity: {
                  index: '/cybersecurity/',
                  priority: '0.9'
                },

                'threat-intelligence': {
                  index: '/threat-intelligence/',
                  priority: '0.9'
                },

                breaches: {
                  index: '/breaches/',
                  priority: '0.9'
                },

                'dark-web': {
                  index: '/dark-web/',
                  priority: '0.9'
                },

                ransomware: {
                  index: '/ransomware/',
                  priority: '0.9'
                },

                'threat-actors': {
                  index: '/threat-actors/',
                  priority: '0.8'
                },

                vulnerabilities: {
                  index: '/vulnerabilities/',
                  priority: '0.9'
                },

                malware: {
                  index: '/malware/',
                  priority: '0.9'
                },

                'ai-security': {
                  index: '/ai-security/',
                  priority: '0.8'
                },

                'cloud-security': {
                  index: '/cloud-security/',
                  priority: '0.8'
                },

                signals: {
                  index: '/signals/',
                  priority: '0.8'
                },

                analysis: {
                  index: '/analysis/',
                  priority: '0.8'
                }
              }
            }
          };

          /*
           * ============================================================
           * STATIC PUBLIC PAGES
           * ============================================================
           */

          const STATIC_PAGES = [
            {
              url: '/',
              priority: '1.0'
            },

            /*
             * Dyve Tech
             */
            {
              url: '/tech/',
              priority: '0.9'
            },

            /*
             * Dyve HackaX
             */
            {
              url: '/cybersecurity/',
              priority: '0.9'
            },
            {
              url: '/threat-intelligence/',
              priority: '0.9'
            },
            {
              url: '/breaches/',
              priority: '0.9'
            },
            {
              url: '/dark-web/',
              priority: '0.9'
            },
            {
              url: '/ransomware/',
              priority: '0.9'
            },
            {
              url: '/threat-actors/',
              priority: '0.8'
            },
            {
              url: '/vulnerabilities/',
              priority: '0.9'
            },
            {
              url: '/malware/',
              priority: '0.9'
            },
            {
              url: '/ai-security/',
              priority: '0.8'
            },
            {
              url: '/cloud-security/',
              priority: '0.8'
            },
            {
              url: '/signals/',
              priority: '0.8'
            },
            {
              url: '/analysis/',
              priority: '0.8'
            },

            /*
             * Corporate / utility
             */
            {
              url: '/about-us/',
              priority: '0.5'
            },
            {
              url: '/faq/',
              priority: '0.5'
            },
            {
              url: '/privacy-policy/',
              priority: '0.3'
            },
            {
              url: '/terms-of-service/',
              priority: '0.3'
            }
          ];

          /*
           * ============================================================
           * LEGACY ROUTES
           * ============================================================
           *
           * These are explicitly forbidden from becoming canonical
           * editorial destinations.
           */

          const LEGACY_SECTIONS = [
            'article',
            'ai',
            'developers',
            'coding'
          ];

          /*
           * ============================================================
           * HELPERS
           * ============================================================
           */

          function fail(message) {
            console.error('');
            console.error('==============================================');
            console.error('SEO AUTHORITY BUILD FAILED');
            console.error('==============================================');
            console.error(message);
            console.error('');
            process.exit(1);
          }

          function escapeXml(value) {
            return String(value)
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;')
              .replace(/'/g, '&apos;');
          }

          function normalizePath(value) {
            return String(value || '')
              .replace(/^\/+/, '')
              .trim();
          }

          function normalizeUrl(value) {
            const raw = String(value || '').trim();

            if (!raw) {
              throw new Error('Empty article URL.');
            }

            /*
             * Absolute URL
             */
            if (/^https?:\/\//i.test(raw)) {
              let parsed;

              try {
                parsed = new URL(raw);
              } catch {
                throw new Error(
                  `Invalid article URL: ${raw}`
                );
              }

              if (parsed.protocol !== 'https:') {
                throw new Error(
                  `Non-HTTPS article URL: ${raw}`
                );
              }

              /*
               * The canonical production host must be www.
               */
              if (parsed.hostname !== SITE_HOST) {
                if (parsed.hostname === REDIRECT_HOST) {
                  throw new Error(
                    `Article URL uses redirect-only host "${REDIRECT_HOST}". ` +
                    `Use "${SITE_HOST}" instead: ${raw}`
                  );
                }

                throw new Error(
                  `Article URL points outside ${SITE_HOST}: ${raw}`
                );
              }

              if (parsed.search || parsed.hash) {
                throw new Error(
                  `Article URL contains query/hash: ${raw}`
                );
              }

              return parsed.pathname
                .replace(/^\/+/, '');
            }

            return normalizePath(raw);
          }

          function validDate(value) {
            const date = String(value || '')
              .slice(0, 10);

            if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) {
              return false;
            }

            const parsed = new Date(
              `${date}T00:00:00Z`
            );

            return (
              !Number.isNaN(parsed.getTime()) &&
              parsed.toISOString().slice(0, 10) === date
            );
          }

          function articleFileExists(articlePath) {
            const absolute = path.resolve(articlePath);
            const root = process.cwd() + path.sep;

            /*
             * Prevent path traversal outside repository.
             */
            if (!absolute.startsWith(root)) {
              return false;
            }

            return (
              fs.existsSync(absolute) &&
              fs.statSync(absolute).isFile()
            );
          }

          function loadDatabase(database) {
            if (!fs.existsSync(database.file)) {
              fail(
                `${database.name}: missing database file ` +
                `${database.file}`
              );
            }

            try {
              return JSON.parse(
                fs.readFileSync(
                  database.file,
                  'utf8'
                )
              );
            } catch (error) {
              fail(
                `${database.name}: unable to parse ` +
                `${database.file}: ${error.message}`
              );
            }
          }

          /*
           * ============================================================
           * ARTICLE HTML CANONICAL VALIDATION
           * ============================================================
           *
           * This validates the actual canonical tag inside each
           * generated article.
           *
           * Sitemap correctness alone is not enough.
           */

          function validateArticleCanonical(
            articlePath,
            expectedCanonical
          ) {
            const absolute = path.resolve(articlePath);

            if (!fs.existsSync(absolute)) {
              return {
                valid: false,
                error: `Canonical file does not exist: ${articlePath}`
              };
            }

            let html;

            try {
              html = fs.readFileSync(
                absolute,
                'utf8'
              );
            } catch (error) {
              return {
                valid: false,
                error:
                  `Unable to read article HTML: ${articlePath}: ` +
                  `${error.message}`
              };
            }

            /*
             * Match the canonical link regardless of attribute order.
             */
            const canonicalMatches = [
              ...html.matchAll(
                /<link\b[^>]*\brel\s*=\s*["']canonical["'][^>]*>/gi
              )
            ];

            /*
             * Also support href appearing before rel.
             */
            const reverseCanonicalMatches = [
              ...html.matchAll(
                /<link\b[^>]*\bhref\s*=\s*["'][^"']+["'][^>]*\brel\s*=\s*["']canonical["'][^>]*>/gi
              )
            ];

            const matches = [
              ...canonicalMatches,
              ...reverseCanonicalMatches
            ];

            if (!matches.length) {
              return {
                valid: false,
                error:
                  `Missing <link rel="canonical"> in ${articlePath}`
              };
            }

            /*
             * Extract every canonical href.
             */
            const canonicalUrls = [];

            for (const match of matches) {
              const tag = match[0];

              const hrefMatch = tag.match(
                /\bhref\s*=\s*["']([^"']+)["']/i
              );

              if (hrefMatch) {
                canonicalUrls.push(
                  hrefMatch[1].trim()
                );
              }
            }

            if (!canonicalUrls.length) {
              return {
                valid: false,
                error:
                  `Canonical link has no readable href in ${articlePath}`
              };
            }

            /*
             * There must be exactly one canonical URL.
             */
            const uniqueCanonicals = [
              ...new Set(canonicalUrls)
            ];

            if (uniqueCanonicals.length !== 1) {
              return {
                valid: false,
                error:
                  `Multiple canonical URLs detected in ${articlePath}: ` +
                  `${uniqueCanonicals.join(', ')}`
              };
            }

            const actualCanonical =
              uniqueCanonicals[0];

            /*
             * Canonical must be absolute.
             */
            if (
              !/^https:\/\//i.test(actualCanonical)
            ) {
              return {
                valid: false,
                error:
                  `Canonical URL must be absolute HTTPS URL in ` +
                  `${articlePath}: ${actualCanonical}`
              };
            }

            let parsedCanonical;

            try {
              parsedCanonical =
                new URL(actualCanonical);
            } catch {
              return {
                valid: false,
                error:
                  `Invalid canonical URL in ${articlePath}: ` +
                  `${actualCanonical}`
              };
            }

            /*
             * Canonical must use www.
             */
            if (
              parsedCanonical.hostname !== SITE_HOST
            ) {
              return {
                valid: false,
                error:
                  `Wrong canonical host in ${articlePath}: ` +
                  `"${parsedCanonical.hostname}". Expected ` +
                  `"${SITE_HOST}".`
              };
            }

            /*
             * Canonical must be HTTPS.
             */
            if (
              parsedCanonical.protocol !== 'https:'
            ) {
              return {
                valid: false,
                error:
                  `Non-HTTPS canonical in ${articlePath}: ` +
                  `${actualCanonical}`
              };
            }

            /*
             * Canonical must not contain query/hash.
             */
            if (
              parsedCanonical.search ||
              parsedCanonical.hash
            ) {
              return {
                valid: false,
                error:
                  `Canonical contains query/hash in ${articlePath}: ` +
                  `${actualCanonical}`
              };
            }

            /*
             * Canonical must match the exact expected URL.
             */
            if (
              actualCanonical !== expectedCanonical
            ) {
              return {
                valid: false,
                error:
                  `Canonical mismatch in ${articlePath}. ` +
                  `Expected "${expectedCanonical}" but found ` +
                  `"${actualCanonical}".`
              };
            }

            return {
              valid: true
            };
          }

          /*
           * ============================================================
           * INITIAL STATE
           * ============================================================
           */

          const errors = [];

          /*
           * Canonical URLs across BOTH publications.
           *
           * This is intentionally global.
           *
           * Dyve Tech and HackaX must never publish the same
           * canonical URL.
           */

          const globalCanonicalUrls = new Set();

          /*
           * Sitemap map.
           *
           * URL -> metadata
           */

          const sitemapUrls = new Map();

          /*
           * ============================================================
           * STATIC URLS
           * ============================================================
           */

          for (const page of STATIC_PAGES) {
            sitemapUrls.set(
              `${SITE_URL}${page.url}`,
              {
                priority: page.priority
              }
            );
          }

          /*
           * ============================================================
           * DATABASE VALIDATION
           * ============================================================
           */

          const statistics = {
            tech: {
              records: 0,
              valid: 0,
              canonical: 0,
              htmlCanonical: 0
            },

            hackax: {
              records: 0,
              valid: 0,
              canonical: 0,
              htmlCanonical: 0
            }
          };

          for (
            const [databaseKey, database]
            of Object.entries(DATABASES)
          ) {
            const articles =
              loadDatabase(database);

            if (!Array.isArray(articles)) {
              errors.push(
                `${database.name}: ${database.file} ` +
                `must contain a JSON array.`
              );
              continue;
            }

            statistics[databaseKey].records =
              articles.length;

            /*
             * ----------------------------------------------------------
             * ARTICLE RECORDS
             * ----------------------------------------------------------
             */

            articles.forEach((article, index) => {
              const number = index + 1;

              if (
                !article ||
                typeof article !== 'object'
              ) {
                errors.push(
                  `${database.name} record #${number}: ` +
                  `article must be an object.`
                );
                return;
              }

              const title = String(
                article.title || ''
              ).trim();

              const page = String(
                article.page || ''
              )
                .trim()
                .toLowerCase();

              /*
               * --------------------------------------------------------
               * TITLE
               * --------------------------------------------------------
               */

              if (!title) {
                errors.push(
                  `${database.name} record #${number}: ` +
                  `missing title.`
                );
              }

              /*
               * --------------------------------------------------------
               * PAGE
               * --------------------------------------------------------
               */

              if (!page) {
                errors.push(
                  `${database.name} record #${number} ` +
                  `"${title || 'Untitled'}": missing page.`
                );
                return;
              }

              /*
               * --------------------------------------------------------
               * SECTION VALIDATION
               * --------------------------------------------------------
               */

              if (!database.sections[page]) {
                errors.push(
                  `${database.name} record #${number} ` +
                  `"${title || 'Untitled'}": unsupported page ` +
                  `"${page}". Expected: ` +
                  `${Object.keys(database.sections).join(', ')}.`
                );
                return;
              }

              /*
               * --------------------------------------------------------
               * URL NORMALIZATION
               * --------------------------------------------------------
               */

              let articlePath;

              try {
                articlePath =
                  normalizeUrl(article.url);
              } catch (error) {
                errors.push(
                  `${database.name} record #${number} ` +
                  `"${title || 'Untitled'}": ${error.message}`
                );
                return;
              }

              /*
               * --------------------------------------------------------
               * LEGACY ROUTE PROTECTION
               * --------------------------------------------------------
               */

              const firstSegment =
                articlePath
                  .split('/')[0]
                  .toLowerCase();

              if (
                LEGACY_SECTIONS.includes(
                  firstSegment
                )
              ) {
                errors.push(
                  `${database.name} record #${number} ` +
                  `"${title || 'Untitled'}": legacy route ` +
                  `"${articlePath}" detected.`
                );
                return;
              }

              /*
               * --------------------------------------------------------
               * EXPECTED CANONICAL PREFIX
               * --------------------------------------------------------
               */

              const expectedPrefix =
                `${page}/`;

              if (
                !articlePath.startsWith(
                  expectedPrefix
                )
              ) {
                errors.push(
                  `${database.name} record #${number} ` +
                  `"${title || 'Untitled'}": URL ` +
                  `"${articlePath}" does not belong to ` +
                  `page="${page}". Expected ` +
                  `"${expectedPrefix}<slug>.html".`
                );
                return;
              }

              /*
               * --------------------------------------------------------
               * SLUG
               * --------------------------------------------------------
               */

              const slug =
                articlePath.slice(
                  expectedPrefix.length
                );

              const canonicalSlugPattern =
                /^[a-z0-9]+(?:-[a-z0-9]+)*\.html$/;

              if (
                !canonicalSlugPattern.test(
                  slug
                )
              ) {
                errors.push(
                  `${database.name} record #${number} ` +
                  `"${title || 'Untitled'}": invalid canonical ` +
                  `route "${articlePath}". Expected ` +
                  `"${page}/<slug>.html".`
                );
                return;
              }

              /*
               * --------------------------------------------------------
               * PHYSICAL FILE
               * --------------------------------------------------------
               */

              if (
                !articleFileExists(articlePath)
              ) {
                errors.push(
                  `${database.name} record #${number} ` +
                  `"${title || 'Untitled'}": canonical file ` +
                  `is missing: ${articlePath}`
                );
                return;
              }

              /*
               * --------------------------------------------------------
               * EXPECTED CANONICAL URL
               * --------------------------------------------------------
               */

              const expectedCanonical =
                `${SITE_URL}/${articlePath}`;

              /*
               * --------------------------------------------------------
               * ACTUAL HTML CANONICAL
               * --------------------------------------------------------
               */

              const htmlCanonical =
                validateArticleCanonical(
                  articlePath,
                  expectedCanonical
                );

              if (!htmlCanonical.valid) {
                errors.push(
                  `${database.name} record #${number} ` +
                  `"${title || 'Untitled'}": ` +
                  `${htmlCanonical.error}`
                );
                return;
              }

              /*
               * --------------------------------------------------------
               * GLOBAL DUPLICATE CHECK
               * --------------------------------------------------------
               */

              if (
                globalCanonicalUrls.has(
                  articlePath
                )
              ) {
                errors.push(
                  `${database.name} record #${number} ` +
                  `"${title || 'Untitled'}": duplicate canonical ` +
                  `URL "${articlePath}".`
                );
                return;
              }

              globalCanonicalUrls.add(
                articlePath
              );

              /*
               * --------------------------------------------------------
               * DATE
               * --------------------------------------------------------
               */

              const articleDate =
                validDate(article.date)
                  ? String(article.date).slice(0, 10)
                  : null;

              /*
               * --------------------------------------------------------
               * ADD TO SITEMAP
               * --------------------------------------------------------
               */

              const sitemapEntry = {
                priority:
                  database.sections[page]
                    .priority
              };

              if (articleDate) {
                sitemapEntry.lastmod =
                  articleDate;
              }

              sitemapUrls.set(
                `${SITE_URL}/${articlePath}`,
                sitemapEntry
              );

              /*
               * --------------------------------------------------------
               * STATISTICS
               * --------------------------------------------------------
               */

              statistics[databaseKey].valid += 1;
              statistics[databaseKey].canonical += 1;
              statistics[databaseKey].htmlCanonical += 1;
            });
          }

          /*
           * ============================================================
           * BUILD FAILURE
           * ============================================================
           */

          if (errors.length) {
            console.error('');

            console.error(
              `Found ${errors.length} SEO integrity error(s):`
            );

            console.error('');

            errors.forEach(
              (error, index) => {
                console.error(
                  `${index + 1}. ${error}`
                );
              }
            );

            fail(
              'Repository failed SEO authority validation. ' +
              'No SEO assets will be committed.'
            );
          }

          /*
           * ============================================================
           * GENERATE SITEMAP XML
           * ============================================================
           */

          const xmlRows =
            Array.from(
              sitemapUrls.entries()
            )
              .sort(
                ([a], [b]) =>
                  a.localeCompare(b)
              )
              .map(
                ([loc, meta]) => {
                  const rows = [
                    '  <url>',
                    `    <loc>${escapeXml(loc)}</loc>`
                  ];

                  if (meta.lastmod) {
                    rows.push(
                      `    <lastmod>${escapeXml(meta.lastmod)}</lastmod>`
                    );
                  }

                  rows.push(
                    `    <priority>${escapeXml(meta.priority)}</priority>`
                  );

                  rows.push(
                    '  </url>'
                  );

                  return rows.join('\n');
                }
              );

          const sitemap = [
            '<?xml version="1.0" encoding="UTF-8"?>',
            '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">',
            ...xmlRows,
            '</urlset>',
            ''
          ].join('\n');

          fs.writeFileSync(
            'sitemap.xml',
            sitemap,
            'utf8'
          );

          /*
           * ============================================================
           * FINAL CANONICAL HOST ASSERTION
           * ============================================================
           */

          for (
            const url
            of sitemapUrls.keys()
          ) {
            const parsed =
              new URL(url);

            if (
              parsed.protocol !== 'https:' ||
              parsed.hostname !== SITE_HOST
            ) {
              fail(
                `Invalid sitemap canonical host: ${url}`
              );
            }
          }

          /*
           * ============================================================
           * BUILD REPORT
           * ============================================================
           */

          console.log('');
          console.log('==============================================');
          console.log('DYVE SEO AUTHORITY ENGINE');
          console.log('==============================================');
          console.log('');

          console.log(
            'CANONICAL HOST'
          );

          console.log(
            SITE_HOST
          );

          console.log('');

          console.log(
            'REDIRECT HOST'
          );

          console.log(
            `${REDIRECT_HOST} -> ${SITE_HOST}`
          );

          console.log('');

          console.log(
            'DYVE TECH'
          );

          console.log(
            'Technology News & Intelligence'
          );

          console.log(
            `Database: ${DATABASES.tech.file}`
          );

          console.log(
            `Records: ${statistics.tech.records}`
          );

          console.log(
            `Validated: ${statistics.tech.valid}`
          );

          console.log(
            `HTML canonicals: ${statistics.tech.htmlCanonical}`
          );

          console.log('');

          console.log(
            'DYVE HACKAX'
          );

          console.log(
            'Cybersecurity Intelligence'
          );

          console.log(
            `Database: ${DATABASES.hackax.file}`
          );

          console.log(
            `Records: ${statistics.hackax.records}`
          );

          console.log(
            `Validated: ${statistics.hackax.valid}`
          );

          console.log(
