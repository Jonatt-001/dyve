      - name: Commit generated SEO assets
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            'Dyve SEO Bot'

          git config \
            user.email \
            'bot@dyve.online'

          git add \
            sitemap.xml \
            robots.txt

          if git diff --cached --quiet; then
            echo \
              'No SEO asset changes detected.'

            exit 0
          fi

          git commit \
            -m 'chore: rebuild Dyve SEO authority assets [bot]'

          # Protect against a concurrent external push.
          git pull --rebase origin main

          git push origin HEAD:main

          echo \
            'SEO assets committed and pushed successfully.'

