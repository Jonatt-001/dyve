      - name: Generate production robots.txt
        shell: bash
        run: |
          set -euo pipefail

          cat > robots.txt <<'EOF'
          # DYVE - Production robots policy
          # Generated automatically by GitHub Actions.
          # Do not edit manually.

          User-agent: *
          Allow: /

          # ==========================================================
          # DYVE TECH
          # Technology News & Intelligence
          # ==========================================================

          Allow: /tech/

          # ==========================================================
          # DYVE HACKAX
          # Cybersecurity Intelligence
          # ==========================================================

          Allow: /cybersecurity/
          Allow: /threat-intelligence/
          Allow: /breaches/
          Allow: /dark-web/
          Allow: /ransomware/
          Allow: /threat-actors/
          Allow: /vulnerabilities/
          Allow: /malware/
          Allow: /ai-security/
          Allow: /cloud-security/
          Allow: /signals/
          Allow: /analysis/

          # ==========================================================
          # PRIVATE / APPLICATION SURFACES
          # ==========================================================

          Disallow: /admin/
          Disallow: /editor/
          Disallow: /tech-editor/
          Disallow: /hackax-editor/

          # Internal article databases
          Disallow: /assets/deltas/
          Disallow: /assets/articles.json
          Disallow: /assets/tech-articles.json

          # ==========================================================
          # SITEMAP
          # ==========================================================

          Sitemap: https://www.dyve.online/sitemap.xml
          EOF

          echo 'Production robots.txt generated.'

      # ============================================================
      # SITEMAP VALIDATION
      # ============================================================

      - name: Validate sitemap.xml
        shell: bash
        run: |
          set -euo pipefail

          test -s sitemap.xml

          grep -q '<urlset' sitemap.xml

          # ========================================================
          # CANONICAL HOST PROTECTION
          # ========================================================

          if grep -Eq \
            '<loc>https://dyve\.online/' \
            sitemap.xml; then

            echo \
              'ERROR: non-www apex URL detected in sitemap.xml.'

            exit 1
          fi

          if grep -Eq \
            '<loc>http://www\.dyve\.online/' \
            sitemap.xml; then

            echo \
              'ERROR: HTTP URL detected in sitemap.xml.'

            exit 1
          fi

          if grep -Eq \
            '<loc>https?://dyve-beta\.vercel\.app/' \
            sitemap.xml; then

            echo \
              'ERROR: Vercel deployment hostname detected in sitemap.xml.'

            exit 1
          fi

          # ========================================================
          # DYVE TECH
          # ========================================================

          grep -q \
            '<loc>https://www.dyve.online/tech/</loc>' \
            sitemap.xml

          # ========================================================
          # HACKAX CORE
          # ========================================================

          grep -q \
            '<loc>https://www.dyve.online/cybersecurity/</loc>' \
            sitemap.xml

          grep -q \
            '<loc>https://www.dyve.online/threat-intelligence/</loc>' \
            sitemap.xml

          grep -q \
            '<loc>https://www.dyve.online/breaches/</loc>' \
            sitemap.xml

          grep -q \
            '<loc>https://www.dyve.online/dark-web/</loc>' \
            sitemap.xml

          grep -q \
            '<loc>https://www.dyve.online/ransomware/</loc>' \
            sitemap.xml

          grep -q \
            '<loc>https://www.dyve.online/threat-actors/</loc>' \
            sitemap.xml

          grep -q \
            '<loc>https://www.dyve.online/vulnerabilities/</loc>' \
            sitemap.xml

          grep -q \
            '<loc>https://www.dyve.online/malware/</loc>' \
            sitemap.xml

          grep -q \
            '<loc>https://www.dyve.online/ai-security/</loc>' \
            sitemap.xml

          grep -q \
            '<loc>https://www.dyve.online/cloud-security/</loc>' \
            sitemap.xml

          grep -q \
            '<loc>https://www.dyve.online/signals/</loc>' \
            sitemap.xml

          grep -q \
            '<loc>https://www.dyve.online/analysis/</loc>' \
            sitemap.xml

          # ========================================================
          # LEGACY ROUTE PROTECTION
          # ========================================================

          if grep -Eq \
            '<loc>https://www\.dyve\.online/article(/|[^<]*)</loc>' \
            sitemap.xml; then

            echo \
              'ERROR: legacy /article/ URL detected in sitemap.xml.'

            exit 1
          fi

          if grep -Eq \
            '<loc>https://www\.dyve\.online/(ai|developers|coding)/' \
            sitemap.xml; then

            echo \
              'ERROR: legacy standalone editorial section detected.'

            exit 1
          fi

          # ========================================================
          # QUERY / HASH PROTECTION
          # ========================================================

          if grep -Eq \
            '<loc>https://www\.dyve\.online/[^<]*(\?|#)[^<]*</loc>' \
            sitemap.xml; then

            echo \
              'ERROR: query/hash URL detected in sitemap.xml.'

            exit 1
          fi

          # ========================================================
          # EXTERNAL HOST PROTECTION
          # ========================================================

          while IFS= read -r loc; do

            url="${loc#<loc>}"
            url="${url%</loc>}"

            if [[ "$url" != https://www.dyve.online/* ]]; then
              echo \
                "ERROR: non-canonical hostname detected: $url"
              exit 1
            fi

          done < <(
            grep -o \
              '<loc>[^<]*</loc>' \
              sitemap.xml
          )

          echo 'Sitemap structural validation: PASS.'

