></div><div class="body"><p>NEW YORK – The advanced use of AI has created a generational shift in the balance between the ability to protect information and the risk of those systems being compromised, according to researchers at Palo Alto Networks (PAN).&nbsp;</p><p>The cybersecurity firm, which has conducted extensive research on the use of frontier AI, opened a window into those findings in a Wednesday media briefing here. After months of participation in&nbsp;<a href="https://www.cybersecuritydive.com/news/ai-anthropic-claude-mythos-project-glasswing-expand/821714/" rel="noopener noreferrer" target="_blank">Anthropic’s Project Glasswing</a>and&nbsp;<a href="https://www.cybersecuritydive.com/news/OpenAI-Daybreak-cyber-threats/820122/?ref=thecybersignal.com" rel="noopener noreferrer" target="_blank">OpenAI’s Daybreak</a>&nbsp;program, PAN security testers were able to discover the volume of security vulnerabilities that would normally take a year to unearth. The danger is that a malicious actor with these same capabilities could weaponize the security flaws at a speed at which most modern security defenses cannot compete</p><p>A lone threat actor armed with such AI can engage in sophisticated, nation-state-level or criminal capabilities without the need for extensive training or experience, according to Sherrod DeGrippo, VP threat intelligence at Palo Alto Networks’ Unit 42.&nbsp;</p><p><br></p><h3>AI-enabled attack window narrows</h3><p>PAN’s Unit 42 was among the first cybersecurity firms to get a bird’s-eye view of how frontier AI had changed the security landscape. Nation-state and criminal threat groups had already begun to incorporate artificial intelligence into their toolkits in prior years, but these new models raised the stakes to such a new level that only a few organizations were able to see these capabilities under a more controlled environment.&nbsp;</p><p>In May, PAN&nbsp;<a href="https://www.cybersecuritydive.com/news/frontier-ai-rapid-discovery-security-vulnerabilities/820258/" rel="noopener noreferrer" target="_blank">warned of a three- to five-month window</a>&nbsp;before adversaries would begin to exploit vulnerabilities at speeds that have never been seen before. More than three months later, the researchers now say those expectations are about to be realized, and security leaders need to prepare for this new threat landscape.&nbsp;</p><p>“Here we are, five months, in and we’re starting to see the wave of this coming now,” said Sam Rubin, senior vice president of Unit 42 Consulting and Threat Intelligence at PAN,&nbsp;during the media presentation.&nbsp;</p><p>The researchers currently are investigating an incident where an adversary was able to use AI to exploit 50 different vulnerabilities and attack paths in the space of 10 hours. The hacker gained initial access, moved laterally within the organization, escalated privileges and stole information.&nbsp;</p><p>That level of activity would normally take two weeks for human actors to accomplish, according to Rubin.&nbsp;</p><p>Palo Alto Networks was among a group of 100 security and technology companies to sign a recent&nbsp;<a href="https://openai.com/collective-cyberdefense/" rel="noopener noreferrer" target="_blank">open letter</a>&nbsp;calling for immediate action to protect against the threat of weaponized AI.&nbsp;</p></div><div style="margin-top:28px;display:flex;gap:8px;flex-wrap:wrap"><span class="tag">Cyber Risk</span><span class="tag">News</span></div></main><section class="related"><a href="../../threat-intelligence/fake-apple-support-ai-calls-target-stolen-device-owners-for-passcodes-and-2fa-codes.html" style="display:block;background:#fff;border:1px solid #dfe8e3;border-radius:10px;padding:12px"><strong>Fake Apple Support AI Calls Target Stolen-Device Owners for Passcodes and 2FA Codes</strong><div style="font-size:.75rem;color:#718079;margin-top:5px">Fake Apple Support AI Calls Target Stolen-Device Owners for Passcodes and 2FA Codes: SOCRadar Threat Research Unit (STRU) said the platform, which it tracks...</div></a></section><footer style="background:#0b1511;color:#fff;text-align:center;padding:44px 20px;margin-top:60px"><div class="brand" style="color:#fff">DYVE<span>|</span>HACKAX</div></footer></body></html>
