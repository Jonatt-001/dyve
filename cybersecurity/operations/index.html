<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Operations | Dyve HackaX</title>
<meta name="description" content="Operations cybersecurity coverage from Dyve HackaX.">
<meta name="robots" content="index,follow,max-image-preview:large">
<link rel="canonical" href="https://dyve.online/cybersecurity/operations/">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Michroma&display=swap" rel="stylesheet">
<style>
:root{
    --bg:#f7faf8;
    --ink:#0b1511;
    --muted:#6a7671;
    --accent:#4F8A73;
    --line:#dfe8e3;
}
*{box-sizing:border-box}
body{
    margin:0;
    background:var(--bg);
    color:#252b28;
    font-family:Inter,system-ui,sans-serif;
}
a{
    color:inherit;
    text-decoration:none;
}
.top{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(247,250,248,.92);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
}
.top-in,.wrap{
    max-width:1180px;
    margin:auto;
}
.top-in{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 20px;
}
.brand{
    color:var(--ink);
    font-family:Michroma,sans-serif;
    font-weight:900;
    letter-spacing:.08em;
}
.brand span{
    color:var(--accent);
}
.hero{
    padding:54px 20px 32px;
    border-bottom:1px solid var(--line);
}
.eyebrow{
    margin-bottom:17px;
    color:var(--accent);
    font-size:.68rem;
    font-weight:900;
    letter-spacing:.22em;
    text-transform:uppercase;
}
.hero h1{
    max-width:950px;
    margin:0;
    color:var(--ink);
    font-family:Michroma,sans-serif;
    font-size:clamp(2rem,5vw,4rem);
    line-height:1.12;
}
.hero p{
    max-width:790px;
    color:var(--muted);
    line-height:1.7;
}
.strip{
    display:flex;
    gap:8px;
    overflow:auto;
    padding:18px 20px;
}
.strip a{
    white-space:nowrap;
    padding:8px 11px;
    border:1px solid var(--line);
    border-radius:999px;
    background:#fff;
    font-size:.66rem;
    font-weight:800;
}
.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    padding:10px 20px 60px;
}
.card{
    overflow:hidden;
    border:1px solid var(--line);
    border-radius:14px;
    background:#fff;
    transition:.2s;
}
.card:hover{
    transform:translateY(-3px);
    box-shadow:0 14px 35px rgba(19,46,36,.08);
}
.thumb{
    position:relative;
    overflow:hidden;
    aspect-ratio:16/10;
    background:#dde7e2;
}
.thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
}
.tag{
    position:absolute;
    left:12px;
    bottom:12px;
    padding:7px 9px;
    background:#fff;
    font-size:.61rem;
    font-weight:900;
    text-transform:uppercase;
}
.body{
    padding:17px;
}
.category{
    color:var(--accent);
    font-size:.62rem;
    font-weight:900;
    letter-spacing:.16em;
    text-transform:uppercase;
}
.card h2{
    color:var(--ink);
    font-family:Michroma,sans-serif;
    font-size:1rem;
    line-height:1.4;
}
.card p{
    color:#6d7571;
    font-size:.83rem;
    line-height:1.55;
}
.meta{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    color:#89928e;
    font-size:.62rem;
    text-transform:uppercase;
}
footer{
    padding:44px 20px;
    background:#0b1511;
    color:#fff;
    text-align:center;
}
@media(max-width:900px){
    .grid{
        grid-template-columns:repeat(2,1fr);
    }
}
@media(max-width:640px){
    .grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>
<body>
<header class="top">
    <div class="top-in">
        <a class="brand" href="../">DYVE<span>|</span>HACKAX</a>
        <a href="../../">DYVE</a>
    </div>
</header>

<main class="wrap">
    <section class="hero">
        <div class="eyebrow">
            Cybersecurity / Operations
        </div>

        <h1>Operations</h1>

        <p>
            Coverage and intelligence for operations.
        </p>
    </section>

    <section class="grid">
        <div style="grid-column:1/-1;padding:40px;background:#fff;border:1px solid #dfe8e3;border-radius:14px;color:#6a7671">No articles in this category.</div>
    </section>
</main>

<footer>
    <div class="brand">
        DYVE<span>|</span>HACKAX
    </div>
</footer>
</body>
</html>
