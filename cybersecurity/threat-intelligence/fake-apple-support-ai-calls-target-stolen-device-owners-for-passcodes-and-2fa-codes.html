ase}.hero img{display:block;width:100%;aspect-ratio:16/9;border-radius:10px;object-fit:cover}.body{max-width:700px;margin:40px auto;font-family:'Source Serif 4',Georgia,serif;font-size:1.15rem;line-height:1.9}.body p{margin:0 0 1.45em}.body h2,.body h3{color:#0b1511;font-family:Inter,sans-serif}.body img{max-width:100%;height:auto;border-radius:7px}.body a{color:#4F8A73;text-decoration:underline;text-underline-offset:3px}.intel{max-width:700px;margin:35px auto;padding:16px;border:1px solid #dfe8e3;border-radius:10px;background:#fff;color:#5f6c66;font-size:.8rem}.tag{display:inline-block;padding:7px 10px;border:1px solid #dfe8e3;border-radius:999px;background:#fff;font-size:.65rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.related{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:860px;margin:60px auto;padding:0 20px}@media(max-width:700px){.related{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="top-in"><a href="../">← Threat Intelligence</a><a class="brand" href="../../">DYVE<span>|</span>HACKAX</a></div></header><main class="page"><div class="kicker">Threat Intelligence / News</div><h1>Fake Apple Support AI Calls Target Stolen-Device Owners for Passcodes and 2FA Codes</h1><div class="dek">Fake Apple Support AI Calls Target Stolen-Device Owners for Passcodes and 2FA Codes: SOCRadar Threat Research Unit (STRU) said the platform, which it tracks...</div><div class="meta">By Dyve HackaX Intelligence Unit · August 29, 2026 · 4 min read · Medium</div><div class="hero"><img src="https://res.cloudinary.com/dxdbn6xwy/image/upload/v1787967809/e9xosiu2ypgutmhvsvu0.jpg" alt="Fake Apple Support AI Calls Target Stolen-Device Owners for Passcodes and 2FA Codes"></div><div class="body"><p>SOCRadar Threat Research Unit (STRU) said the platform, which it tracks as&nbsp;<strong>AnonyMousKIT</strong>, is credit-metered and drives lures across five channels from a single victim record, comprising email at 1.50 credits, SMS priced per sender ID, WhatsApp, a recorded voice call at 1 credit, and an AI voice agent at 2 credits.</p><p>The targets are owners of Apple devices that were recently lost or stolen, and the pages and calls ask each of them for the 4- or 6-digit device passcode, then the Apple ID credentials, and finally a live two-factor authentication (2FA) code. Apple's own guidance states that the company never asks for a password, device passcode, or 2FA code to provide support.</p><p>"AnonyMousKIT is best understood not as a phishing kit but a small software business with a criminal customer base. It features credit bundles, published pricing, tiered subscriptions, customer support, status tracking, and infrastructure replacement protocols," SOCRadar said&nbsp;<a href="https://socradar.io/blog/anonymouskit-ai-phaas-supply-chain/" rel="noopener noreferrer" target="_blank" style="color: rgb(64, 64, 74);">in a Monday report</a>.</p><p>Activation Lock, introduced in iOS 7, ties the hardware to a specific Apple ID and renders a stolen handset unusable until the owner's account is removed.</p><p><br></p><p>Lures cite the handset's internal Apple model identifier and its live Find My status, both pulled from the stolen device itself. Victims who follow the link reach an Apple-branded capture page that renders an animated map of the handset's reported location.</p><p>The AI voice channel is the best-documented vector after email, with 200 call records, 55 transcripts, and five configured personas recovered from the operator's account with the commercial voice platform&nbsp;<strong>Vapi</strong>.</p><p>The researchers' report does not say whether the account was reported to Vapi, and neither company has said publicly whether it is still active. All five personas carry the same translated identity, Alice from Apple Support, across English, Spanish, and Portuguese.</p><p><br></p><p>The calls ran between August 31, 2025 and May 30, 2026, and 179 of the 200 went to numbers in Brazil. In the recovered transcript, the agent asks the victim to confirm ownership, then requests the four- or six-digit passcode and reads the digits back for confirmation.</p><p>It then explains that someone visited an Apple Store to remove the Activation Lock and asks whether a recovery link has arrived via text. The researchers put the total cost of the 200 calls at $19.24, or about 9.6 cents each.</p><p>The outcome table in the report assigns all 200 calls to one of four results, comprising 100 victims who hung up, 48 silence timeouts, 24 no-answers, and 28 platform errors or busy signals. No count of captured passcodes, Apple IDs, or 2FA codes appears in the report for any of the five channels.</p><p>The logs reached SOCRadar via two bare relative file paths in the shared codebase that resolve to the web root and allow unauthenticated HTTP access. Every deployment of that codebase inherits the flaw.</p><p><br></p><p>A scan of 506 kit-family domains identified 30 distinct installations reachable on 42 domains, with 188 of the 506 live.</p><p>The AnonyMousKIT installation logged 691 send attempts between March and July 2026, compared with 6,092 across the 30 backends.</p><p>Three storefronts, i-Blocker, Key Unlock, and KG-KING, launched in the same second on April 10, 2026, sharing the same Gmail relay accounts. SOCRadar assessed that pattern as one buyer running three brands rather than three separate customers.</p><p>The researchers recorded the following characteristics of the email lures -</p><ul><li>The top two subject lines were "Your device has been found" (308 of 691) and "Alert" (157)</li><li>Display names spoofed Apple, Find My, Apple Support, and Apple Assistance</li><li>627 of the logged sends relayed through a single free Gmail account, noreplyapple00000[@]gmail[.]com, against 20 and 2 for the two other relay accounts</li><li>678 of the 691 lures carried a location token naming a city, including Johannesburg, Abuja, Buenos Aires, Maputo, and Mumbai</li><li>Victim-facing capture pages were served from tokenized /help?TOKEN URLs</li></ul><p>South Africa accounts for 1,735 of the 6,092 family-wide sends, and 64 of AnonyMousKIT's own 691 sends reached non-consumer domains, including 27 to South African government addresses. SOCRadar said those recipients were selected because their devices were stolen, not because of their roles.</p><p>The report said the four unlock tools offered on the panel serve as bait, because 5,649 of the 6,092 targeted devices, or 92.7%, run A12 silicon or newer.</p><p><br></p><p><a href="https://thehackernews.com/2019/09/bootrom-jailbreak-ios-exploit.html" rel="noopener noreferrer" target="_blank" style="color: rgb(64, 64, 74);">The checkm8 bootrom exploit</a>&nbsp;reaches only A5 through A11 chips. It also states that technical bypasses are obsolete now that Apple has moved past the checkm8 generation.&nbsp;<a href="https://thehackernews.com/2026/06/unpatchable-usbliter8-exploit-breaks.html" rel="noopener noreferrer" target="_blank" style="color: rgb(64, 64, 74);">A public bootrom exploit</a>&nbsp;for A12 and A13 was released on June 18, 2026, two months before the report, and its proof of concept remains live.</p><p>Its authors describe it as a tethered bootrom exploit requiring physical possession and device firmware update (DFU) mode, and the research does not show a Secure Enclave compromise. Its control tool demotes the device to production mode or boots a raw iBoot image, and neither action recovers a device passcode or removes Activation Lock.</p><p>SOCRadar described the automated, LLM-driven voice vector as the platform's primary innovation.</p></div><div style="margin-top:28px;display:flex;gap:8px;flex-wrap:wrap"><span class="tag">Threat Intelligence</span><span class="tag">News</span></div></main><section class="related"></section><footer style="background:#0b1511;color:#fff;text-align:center;padding:44px 20px;margin-top:60px"><div class="brand" style="color:#fff">DYVE<span>|</span>HACKAX</div></footer></body></html>
