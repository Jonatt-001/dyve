<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <meta name="description" content="HackaX Domain Intelligence scan results.">
    <title>HackaX — Intelligence Report</title>

    <style>
        @import url("https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap");

        :root {
            --bg: #050505;
            --ink: #f2f0e8;
            --muted: #8b8a84;
            --muted2: #66655f;
            --line: rgba(242,240,232,.15);
            --acid: #d7ff3f;
            --violet: #713cff;
            --red: #ff655d;
            --amber: #f1b64f;
            --green: #73e8a6;
            --panel: #090909;
        }

        * { box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            color: var(--ink);
            background:
                radial-gradient(circle at 75% 0%, rgba(113,60,255,.14), transparent 30rem),
                var(--bg);
            font-family: Inter, Arial, sans-serif;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 100;
            opacity: .035;
            background-image:
                linear-gradient(rgba(255,255,255,.5) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.5) 1px, transparent 1px);
            background-size: 72px 72px;
            mask-image: linear-gradient(to bottom, black, transparent 75%);
        }

        a { color: inherit; text-decoration: none; }

        button, input { font: inherit; }

        .shell {
            width: min(1440px, calc(100% - 48px));
            margin: 0 auto;
        }

        .topbar {
            height: 78px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--line);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            letter-spacing: -.04em;
        }

        .mark {
            width: 28px;
            height: 28px;
            border: 1px solid var(--ink);
            transform: rotate(45deg);
            display: grid;
            place-items: center;
        }

        .mark::after {
            content: "";
            width: 8px;
            height: 8px;
            background: var(--acid);
        }

        .brand span:last-child b { color: var(--acid); }

        .top-meta {
            display: flex;
            align-items: center;
            gap: 20px;
            font: 9px "DM Mono", monospace;
            color: var(--muted);
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .online {
            color: var(--acid);
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .online i {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--acid);
            box-shadow: 0 0 13px var(--acid);
        }

        .back {
            border: 1px solid var(--line);
            padding: 9px 12px;
            color: var(--ink);
        }

        .report-head {
            padding: 75px 0 48px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 50px;
            align-items: end;
            border-bottom: 1px solid var(--line);
        }

        .kicker {
            color: var(--acid);
            font: 10px "DM Mono", monospace;
            letter-spacing: .13em;
            text-transform: uppercase;
            margin-bottom: 17px;
        }

        h1 {
            margin: 0;
            max-width: 900px;
            font: 800 clamp(64px, 9vw, 132px)/.78 "Barlow Condensed", Impact, sans-serif;
            letter-spacing: -.055em;
            text-transform: uppercase;
        }

        .domain {
            margin-top: 23px;
            color: var(--muted);
            font: 12px "DM Mono", monospace;
            word-break: break-all;
        }

        .scan-time {
            text-align: right;
            color: var(--muted2);
            font: 9px "DM Mono", monospace;
            line-height: 1.8;
            text-transform: uppercase;
        }

        .hero-report {
            display: grid;
            grid-template-columns: 330px 1fr;
            gap: 16px;
            padding: 18px 0 0;
        }

        .card {
            background: rgba(9,9,9,.88);
            border: 1px solid var(--line);
        }

        .score-card {
            min-height: 370px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 28px;
            position: relative;
            overflow: hidden;
        }

        .score-card::before {
            content: "";
            position: absolute;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(113,60,255,.28), transparent 65%);
            filter: blur(10px);
        }

        .score-ring {
            width: 215px;
            height: 215px;
            border-radius: 50%;
            position: relative;
            display: grid;
            place-items: center;
            background: conic-gradient(var(--acid) calc(var(--score) * 1%), rgba(242,240,232,.07) 0);
            box-shadow: 0 0 80px rgba(113,60,255,.12);
        }

        .score-ring::after {
            content: "";
            position: absolute;
            inset: 13px;
            background: #080808;
            border-radius: 50%;
            border: 1px solid var(--line);
        }

        .score-value {
            position: relative;
            z-index: 2;
            font: 800 67px/.8 "Barlow Condensed", sans-serif;
            letter-spacing: -.04em;
        }

        .score-unit {
            position: absolute;
            z-index: 3;
            bottom: 62px;
            color: var(--muted);
            font: 9px "DM Mono", monospace;
            letter-spacing: .12em;
        }

        .score-label {
            margin-top: 25px;
            color: var(--acid);
            font: 600 13px "DM Mono", monospace;
            text-transform: uppercase;
            letter-spacing: .08em;
        }

        .overview {
            min-height: 370px;
            padding: 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .overview-top {
            display: flex;
            justify-content: space-between;
            gap: 25px;
        }

        .eyebrow {
            color: var(--muted2);
            font: 9px "DM Mono", monospace;
            text-transform: uppercase;
            letter-spacing: .1em;
        }

        .overview h2 {
            margin: 9px 0 0;
            font: 700 clamp(32px, 4vw, 56px)/.88 "Barlow Condensed", sans-serif;
            letter-spacing: -.035em;
            text-transform: uppercase;
        }

        .badge {
            border: 1px solid rgba(215,255,63,.28);
            background: rgba(215,255,63,.07);
            color: var(--acid);
            height: fit-content;
            padding: 9px 11px;
            font: 9px "DM Mono", monospace;
            white-space: nowrap;
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
        }

        .metric {
            padding: 19px 15px;
            border-right: 1px solid var(--line);
        }

        .metric:last-child { border-right: 0; }

        .metric label {
            display: block;
            color: var(--muted2);
            font: 8px "DM Mono", monospace;
            text-transform: uppercase;
        }

        .metric strong {
            display: block;
            margin-top: 10px;
            font: 700 32px "Barlow Condensed", sans-serif;
        }

        .metric strong.pass { color: var(--green); }
        .metric strong.warn { color: var(--amber); }
        .metric strong.fail { color: var(--red); }

        .surface {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            padding: 16px 0 0;
        }

        .section-card {
            border: 1px solid var(--line);
            background: rgba(9,9,9,.88);
        }

        .section-title {
            min-height: 66px;
            padding: 19px 21px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--line);
        }

        .section-title h3 {
            margin: 0;
            font: 700 20px "Barlow Condensed", sans-serif;
            text-transform: uppercase;
            letter-spacing: -.01em;
        }

        .section-title span {
            color: var(--muted2);
            font: 8px "DM Mono", monospace;
            text-transform: uppercase;
        }

        .findings {
            padding: 0 21px;
        }

        .finding {
            padding: 19px 0;
            display: grid;
            grid-template-columns: 35px 1fr auto;
            gap: 12px;
            border-bottom: 1px solid var(--line);
        }

        .finding:last-child { border-bottom: 0; }

        .finding-icon {
            width: 28px;
            height: 28px;
            display: grid;
            place-items: center;
            border: 1px solid var(--line);
            font: 12px "DM Mono", monospace;
        }

        .finding.pass .finding-icon { color: var(--green); border-color: rgba(115,232,166,.25); }
        .finding.warn .finding-icon { color: var(--amber); border-color: rgba(241,182,79,.25); }
        .finding.fail .finding-icon { color: var(--red); border-color: rgba(255,101,93,.25); }

        .finding h4 {
            margin: 0;
            font-size: 13px;
            font-weight: 700;
        }

        .finding p {
            margin: 5px 0 0;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.55;
        }

        .finding .severity {
            color: var(--muted2);
            font: 8px "DM Mono", monospace;
            text-transform: uppercase;
        }

        .evidence {
            grid-column: 2 / 3;
            margin-top: 9px;
            padding: 9px 10px;
            background: rgba(255,255,255,.025);
            border-left: 1px solid var(--line);
            color: #aaa9a2;
            font: 9px/1.55 "DM Mono", monospace;
            overflow-wrap: anywhere;
        }

        .fix {
            grid-column: 2 / 3;
            color: var(--acid) !important;
        }

        .data {
            padding: 0 21px;
        }

        .data-row {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 20px;
            padding: 16px 0;
            border-bottom: 1px solid var(--line);
            font-size: 11px;
        }

        .data-row:last-child { border-bottom: 0; }

        .data-row label {
            color: var(--muted2);
            font: 8px "DM Mono", monospace;
            text-transform: uppercase;
        }

        .data-row div {
            color: #d0cfc8;
            text-align: right;
            overflow-wrap: anywhere;
        }

        .mono { font-family: "DM Mono", monospace; }

        .actions {
            margin: 16px 0 0;
            border: 1px solid var(--line);
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 30px;
            background:
                linear-gradient(100deg, rgba(113,60,255,.12), transparent 60%),
                #090909;
        }

        .actions h3 {
            margin: 0 0 7px;
            font: 700 28px "Barlow Condensed", sans-serif;
            text-transform: uppercase;
        }

        .actions p {
            margin: 0;
            max-width: 650px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.6;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn {
            min-height: 48px;
            padding: 0 18px;
            border: 1px solid var(--line);
            background: transparent;
            color: var(--ink);
            cursor: pointer;
            font-size: 11px;
            font-weight: 800;
        }

        .btn.primary {
            background: var(--acid);
            border-color: var(--acid);
            color: #050505;
        }

        .btn:hover { transform: translateY(-1px); }

        footer {
            padding: 50px 0 70px;
            color: var(--muted2);
            display: flex;
            justify-content: space-between;
            gap: 20px;
            font: 8px "DM Mono", monospace;
            text-transform: uppercase;
            letter-spacing: .08em;
        }

        .error-state {
            min-height: 70vh;
            display: grid;
            place-items: center;
            text-align: center;
        }

        .error-state h1 {
            font-size: clamp(60px, 10vw, 130px);
        }

        .error-state p {
            color: var(--muted);
            max-width: 480px;
            line-height: 1.7;
        }

        .loading {
            min-height: 70vh;
            display: grid;
            place-items: center;
            color: var(--acid);
            font: 11px "DM Mono", monospace;
            text-transform: uppercase;
            letter-spacing: .12em;
        }

        .loading::after {
            content: "";
            width: 8px;
            height: 8px;
            margin-left: 9px;
            display: inline-block;
            background: var(--acid);
            animation: blink .7s infinite alternate;
        }

        @keyframes blink { to { opacity: .2; } }

        @media (max-width: 900px) {
            .hero-report {
                grid-template-columns: 1fr;
            }

            .score-card { min-height: 330px; }

            .surface {
                grid-template-columns: 1fr;
            }

            .report-head {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .scan-time { text-align: left; }
        }

        @media (max-width: 650px) {
            .shell {
                width: min(100% - 24px, 1440px);
            }

            .topbar {
                height: 66px;
            }

            .top-meta .online {
                display: none;
            }

            .report-head {
                padding: 55px 0 35px;
            }

            h1 {
                font-size: clamp(68px, 21vw, 110px);
            }

            .overview {
                padding: 20px;
            }

            .overview-top {
                flex-direction: column;
                gap: 18px;
            }

            .metrics {
                grid-template-columns: 1fr;
            }

            .metric {
                border-right: 0;
                border-bottom: 1px solid var(--line);
            }

            .metric:last-child {
                border-bottom: 0;
            }

            .finding {
                grid-template-columns: 30px 1fr;
            }

            .finding .severity {
                grid-column: 2;
            }

            .evidence,
            .fix {
                grid-column: 2;
            }

            .data-row {
                grid-template-columns: 95px 1fr;
            }

            .actions {
                flex-direction: column;
                align-items: flex-start;
            }

            .action-buttons {
                width: 100%;
            }

            .btn {
                flex: 1;
            }

            footer {
                flex-direction: column;
            }
        }

        @media print {
            body::before, .topbar, .actions, footer { display: none !important; }
            body { background: white; color: black; }
            .card, .section-card { break-inside: avoid; background: white; color: black; }
        }
    </style>
</head>

<body>
    <header class="topbar shell">
        <a class="brand" href="/">
            <span class="mark"></span>
            <span>DYVE <b>/</b> HACKAX</span>
        </a>

        <div class="top-meta">
            <span class="online"><i></i> SCANNER ONLINE</span>
            <a class="back" href="/">NEW SCAN</a>
        </div>
    </header>

    <main id="app">
        <div class="loading" id="loading">ASSEMBLING INTELLIGENCE</div>
    </main>

    <footer class="shell">
        <span>DYVE / HACKAX — DOMAIN INTELLIGENCE</span>
        <span>OBSERVATION ≠ PENETRATION TEST</span>
    </footer>

    <script>
        const app = document.getElementById("app");

        const esc = value => String(value ?? "").replace(/[&<>"']/g, char => ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"
        }[char]));

        const formatDate = value => {
            try {
                return new Intl.DateTimeFormat(undefined, {
                    dateStyle: "medium",
                    timeStyle: "short"
                }).format(new Date(value));
            } catch {
                return String(value || "Unknown");
            }
        };

        const statusSymbol = status => status === "pass" ? "✓" : status === "warn" ? "!" : "×";

        function dataRow(label, value) {
            return `
                <div class="data-row">
                    <label>${esc(label)}</label>
                    <div>${esc(value || "—")}</div>
                </div>
            `;
        }

        function findingMarkup(item) {
            return `
                <article class="finding ${esc(item.status)}">
                    <div class="finding-icon">${statusSymbol(item.status)}</div>
                    <div>
                        <h4>${esc(item.name)}</h4>
                        <p>${esc(item.summary)}</p>
                    </div>
                    <div class="severity">${esc(item.severity)}</div>
                    <div class="evidence">${esc(item.detail)}</div>
                    <p class="fix"><strong>RECOMMENDATION:</strong> ${esc(item.fix)}</p>
                </article>
            `;
        }

        function render(data) {
            const findings = Array.isArray(data.findings) ? data.findings : [];
            const passed = findings.filter(x => x.status === "pass").length;
            const warnings = findings.filter(x => x.status === "warn").length;
            const failed = findings.filter(x => x.status === "fail").length;

            const ipv4 = data.dns?.ipv4?.join(", ") || "None detected";
            const ipv6 = data.dns?.ipv6?.join(", ") || "None detected";
            const nameservers = data.dns?.ns?.join(", ") || "None detected";
            const mx = data.email?.mx?.map(x => `${x.exchange} (${x.priority})`).join(", ") || "None detected";

            const tls = data.tls || {};
            const issuer = tls.issuer?.O || tls.issuer?.CN || "Unknown";
            const subject = tls.subject?.CN || "Unknown";

            app.innerHTML = `
                <section class="shell report-head">
                    <div>
                        <div class="kicker">01 / DOMAIN INTELLIGENCE REPORT</div>
                        <h1>PUBLIC SURFACE<br>ANALYSIS.</h1>
                        <div class="domain">${esc(data.domain)}</div>
                    </div>

                    <div class="scan-time">
                        <div>SCAN COMPLETE</div>
                        <div>${esc(formatDate(data.scannedAt))}</div>
                        <div>${esc(data.durationMs)} MS / LIVE PASS</div>
                    </div>
                </section>

                <section class="shell hero-report">
                    <article class="card score-card">
                        <div class="score-ring" style="--score:${Number(data.score) || 0}">
                            <div class="score-value">${esc(data.score)}</div>
                            <div class="score-unit">/ 100</div>
                        </div>
                        <div class="score-label">${esc(data.label)} POSTURE</div>
                    </article>

                    <article class="card overview">
                        <div class="overview-top">
                            <div>
                                <div class="eyebrow">HACKAX / OBSERVATION ENGINE</div>
                                <h2>What the public surface says.</h2>
                            </div>
                            <div class="badge">LIVE OBSERVATION</div>
                        </div>

                        <div class="metrics">
                            <div class="metric">
                                <label>Passed</label>
                                <strong class="pass">${passed}</strong>
                            </div>
                            <div class="metric">
                                <label>Warnings</label>
                                <strong class="warn">${warnings}</strong>
                            </div>
                            <div class="metric">
                                <label>Failures</label>
                                <strong class="fail">${failed}</strong>
                            </div>
                        </div>

                        <div class="eyebrow">
                            The score is a heuristic posture indicator based on the public checks performed. It is not a penetration test or compliance certification.
                        </div>
                    </article>
                </section>

                <section class="shell surface">
                    <article class="section-card">
                        <div class="section-title">
                            <h3>Security findings</h3>
                            <span>${findings.length} checks</span>
                        </div>
                        <div class="findings">
                            ${findings.length ? findings.map(findingMarkup).join("") : "<p>No findings returned.</p>"}
                        </div>
                    </article>

                    <article class="section-card">
                        <div class="section-title">
                            <h3>DNS / EMAIL</h3>
                            <span>RESOLVED LIVE</span>
                        </div>
                        <div class="data">
                            ${dataRow("IPv4", ipv4)}
                            ${dataRow("IPv6", ipv6)}
                            ${dataRow("Nameservers", nameservers)}
                            ${dataRow("SPF", data.email?.spf ? "Detected" : "Not detected")}
                            ${dataRow("DMARC", data.email?.dmarc ? "Detected" : "Not detected")}
                            ${dataRow("MX", mx)}
                        </div>
                    </article>

                    <article class="section-card">
                        <div class="section-title">
                            <h3>TLS CERTIFICATE</h3>
                            <span>PORT 443</span>
                        </div>
                        <div class="data">
                            ${dataRow("Authorized", tls.authorized ? "Yes" : "No")}
                            ${dataRow("Subject", subject)}
                            ${dataRow("Issuer", issuer)}
                            ${dataRow("Valid from", tls.validFrom ? formatDate(tls.validFrom) : "Unknown")}
                            ${dataRow("Valid to", tls.validTo ? formatDate(tls.validTo) : "Unknown")}
                            ${dataRow("Days left", tls.daysRemaining ?? "Unknown")}
                            ${dataRow("Validation", tls.authorizationError || tls.error || "No reported error")}
                        </div>
                    </article>

                    <article class="section-card">
                        <div class="section-title">
                            <h3>WEB DISCOVERY</h3>
                            <span>INDEXABILITY SIGNALS</span>
                        </div>
                        <div class="data">
                            ${dataRow("robots.txt", data.seo?.robots ? "Reachable" : "Not confirmed")}
                            ${dataRow("sitemap.xml", data.seo?.sitemap ? "Reachable" : "Not confirmed")}
                            ${dataRow("Canonical", data.seo?.canonical || "Not detected")}
                            ${dataRow("Meta robots", data.seo?.metaRobots || "Not detected")}
                        </div>
                    </article>
                </section>

                <section class="shell actions">
                    <div>
                        <h3>Keep watching the surface.</h3>
                        <p>
                            This scan is a point-in-time observation. The next product layer is continuous monitoring: scheduled rescans, change detection and alerts when a domain's public posture changes.
                        </p>
                    </div>

                    <div class="action-buttons">
                        <button class="btn" id="printBtn" type="button">PRINT REPORT</button>
                        <button class="btn primary" id="monitorBtn" type="button">MONITOR DOMAIN →</button>
                    </div>
                </section>
            `;

            document.getElementById("printBtn").addEventListener("click", () => window.print());

            document.getElementById("monitorBtn").addEventListener("click", () => {
                alert("Monitoring is the next Dyve Pro layer. Your scan is ready to become a monitored asset.");
            });
        }

        const raw = sessionStorage.getItem("hackaxScanResult");

        if (!raw) {
            app.innerHTML = `
                <section class="shell error-state">
                    <div>
                        <div class="kicker">00 / NO REPORT</div>
                        <h1>RUN A<br>SCAN.</h1>
                        <p>No scan result is available in this session. Start from the HackaX scanner and run a public-domain intelligence pass.</p>
                        <a class="btn primary" href="/">RETURN TO SCANNER →</a>
                    </div>
                </section>
            `;
        } else {
            try {
                const data = JSON.parse(raw);
                render(data);
            } catch {
                sessionStorage.removeItem("hackaxScanResult");
                app.innerHTML = `
                    <section class="shell error-state">
                        <div>
                            <div class="kicker">00 / REPORT ERROR</div>
                            <h1>INVALID<br>REPORT.</h1>
                            <p>The saved scan result could not be read. Run a new intelligence pass.</p>
                            <a class="btn primary" href="/">NEW SCAN →</a>
                        </div>
                    </section>
                `;
            }
        }
    </script>
</body>
</html>
